/* Layout: the jar artwork is the board; stamps sit on its 30 painted circles, controls and log follow below */
:root{
  --bg:#FBF5EA; --surface:#FFFDF8; --ink:#5B3B2A; --muted:#8C7262; --line:#EADFCB;
  --stamp-ink:#D0675B; --accent:#B8573F; --accent-ink:#FFFFFF; --soft:#F6ECDC;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.board{position:relative;width:100%;aspect-ratio:1696/2528;background:#FCF7EE url("board.webp?v=3") center/100% 100% no-repeat;border-radius:18px;overflow:hidden}
.slot{position:absolute;width:10.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;padding:0}
.slot.next{box-shadow:0 0 0 3px var(--stamp-ink);animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(208,103,91,.35)}}
.seal{position:absolute;inset:-9%;background:var(--stamp-ink);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat;opacity:.93}
.slot.on::before{content:"";position:absolute;inset:4%;border-radius:50%;background:rgba(255,253,248,.82)}
.slot.pop .seal{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.7) rotate(-18deg);opacity:0}100%{opacity:.93}}
@media (prefers-reduced-motion:reduce){.slot.next,.slot.pop .seal{animation:none}}
.plaque{position:absolute;left:50%;top:94.6%;transform:translate(-50%,-50%);width:28%;text-align:center;font-family:var(--display);color:var(--ink);font-size:clamp(11px,3.4vw,18px);white-space:nowrap;font-variant-numeric:tabular-nums}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager{display:flex;align-items:center;gap:6px}
.pager button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-family:var(--display);font-size:16px}
.count{font-family:var(--display);font-size:16px;color:var(--muted)}
.count b{color:var(--stamp-ink);font-size:24px;font-weight:400}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 10px;font-size:12px}
.done{background:var(--soft);border-radius:14px;padding:12px;text-align:center;font-family:var(--display);font-size:18px;color:var(--accent)}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px;font-size:17px;font-family:var(--display);width:100%}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.danger{color:#B23B32;background:none;border:0;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px}
.row .primary{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}

.compose{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.compose label{font-size:14px}
.compose textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px}
.hint{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.detail .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail p{margin:0;font-size:16px;overflow-wrap:anywhere}

.dday{background:var(--soft);border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dday .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.dday .lbl span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.dnum{font-family:var(--display);font-size:clamp(34px,10vw,46px);color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.dateform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.dateform input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.log ol{margin:0;padding:0}
.log li{list-style:none;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.no{font-family:var(--display);color:var(--stamp-ink);font-size:16px;font-variant-numeric:tabular-nums}
.log .txt{min-width:0}
.log .txt p{margin:0;overflow-wrap:anywhere}
.log time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:10px 0;margin:0}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.admin{display:flex;justify-content:center}
.pinform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:100%}
.pinform label{font-size:13px;color:var(--muted);width:100%;text-align:center}
.pinform input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:9em}
.pinform .primary{width:auto;padding:10px 16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="sr">우리 연이 칭찬합니다 · 참 기특해요</h1>

  <div class="board" id="board" role="group" aria-label="칭찬 도장판"></div>

  <div class="bar">
    <div class="pager">
      <button id="prev" aria-label="이전 판">‹</button>
      <span id="boardNo">1번째 판</span>
      <button id="next" aria-label="다음 판">›</button>
    </div>
    <span class="pill" id="mode" hidden></span>
    <div class="count"><b id="cnt">0</b> / 30</div>
  </div>
  <div id="doneBox"></div>
  <div id="panel"></div>
  <button class="primary" id="stampBtn">칭찬 도장 찍기</button>

  <section class="dday" id="dday"></section>

  <section class="card log" aria-labelledby="logTitle">
    <h2 id="logTitle">칭찬 기록</h2>
    <div id="log"></div>
  </section>
  <p class="note" id="status">기록을 불러오는 중이에요.</p>
  <div class="admin" id="admin"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzjj1_T2-3i9IEL6FcKp2LOqsu1msAuL6nBPiHxrvYIvvUWgOXWJ1KEuHKyBJZE2qe3IQ/exec";
const PER = 30;
const XS=[375,617,858,1099,1340], YS=[986,1209,1434,1656,1880,2104], W=1696, H=2528;
const PRESETS = {
  "생활": ["밥 잘 챙겨 먹었어","일찍 일어났어","제때 잠들었어","방 청소했어","물 많이 마셨어","알람 듣고 바로 일어났어"],
  "공부·일": ["과제 끝냈어","수업 다 들었어","발표 잘 해냈어","시험 공부했어","토익 공부했어","미뤄둔 일 처리했어"],
  "건강": ["운동 다녀왔어","오래 걸었어","영양제 챙겨 먹었어","야식 참았어"],
  "마음": ["힘든 하루 잘 버텼어","속상한 일 털어놨어","스스로 칭찬해줬어","새로운 거 도전했어","화 안 내고 넘겼어","쉬어야 할 때 잘 쉬었어"],
  "우리": ["먼저 연락해줬어","보고 싶다고 말해줬어","고맙다고 말해줬어","약속 시간 잘 지켰어","내 얘기 잘 들어줬어"]
};
let presetGroup="생활", stamps=[], startDate="", viewBoard=null, panel=null, editingDate=false, justStamped=null, canWrite=false, store=null;
const $=id=>document.getElementById(id);
const PIN_KEY="yeon-pin"; let pin=""; try{pin=localStorage.getItem(PIN_KEY)||"";}catch(e){}
const kstShort=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function todayKST(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date());}
function dayDiff(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400);}
function latestBoard(){return stamps.length===0?0:Math.floor((stamps.length-1)/PER);}

function render(){
  const latest=latestBoard(), b=viewBoard===null?latest:Math.min(viewBoard,latest);
  const onBoard=stamps.slice(b*PER,(b+1)*PER), isLatest=b===latest, full=onBoard.length===PER;
  const nextIdx=isLatest&&!full&&canWrite?onBoard.length:-1;
  let html="";
  for(let i=0;i<PER;i++){
    const x=XS[i%5]/W*100, y=YS[Math.floor(i/5)]/H*100, s=onBoard[i];
    const pos=`left:${x}%;top:${y}%`;
    if(s){const rot=((s.id.charCodeAt(0)+i*7)%21)-10;
      html+=`<button class="slot on${justStamped===s.id?" pop":""}" style="${pos}" data-id="${s.id}" aria-label="${i+1}번 칭찬: ${esc(s.reason)}"><span class="seal" style="transform:rotate(${rot}deg)"></span></button>`;}
    else html+=`<button class="slot${i===nextIdx?" next":""}" style="${pos}" data-empty="${i===nextIdx?1:0}" aria-label="${i+1}번 빈 칸"${i===nextIdx?"":" tabindex=\"-1\""}></button>`;
  }
  const [ty,tm,td]=todayKST().split("-");
  html+=`<div class="plaque" aria-label="오늘 날짜">${ty}. ${tm}. ${td}</div>`;
  $("board").innerHTML=html; justStamped=null;
  $("boardNo").textContent=`${b+1}번째 판`;
  $("prev").disabled=b===0; $("next").disabled=b>=latest;
  $("cnt").textContent=onBoard.length;
  $("doneBox").innerHTML=full?`<div class="done">${b+1}번째 병을 가득 채웠어요! 연이 정말 기특해</div>`:"";

  const dd=$("dday");
  if(editingDate){
    dd.innerHTML=`<form class="dateform" id="dform"><label for="startIn">함께한 첫날</label><input type="date" id="startIn" value="${startDate}" max="${todayKST()}" required><button class="primary" style="width:auto;padding:8px 14px;font-size:15px">저장</button><button type="button" class="ghost" id="dcancel" style="padding:8px 12px">취소</button></form>`;
    $("dform").onsubmit=async e=>{e.preventDefault();const v=$("startIn").value;if(!v)return;editingDate=false;startDate=v;render();try{await store.setStart(v);}catch(err){toast(writeErr(err));}};
    $("dcancel").onclick=()=>{editingDate=false;render();};
  }else if(startDate){
    const n=dayDiff(startDate,todayKST())+1,[y,m,d]=startDate.split("-");
    dd.innerHTML=`<div class="lbl"><b style="font-weight:400">우리가 함께한 시간</b><span>${y}. ${m}. ${d}부터, 오늘까지</span>${canWrite?'<button class="linkbtn" id="dedit" style="align-self:flex-start">날짜 바꾸기</button>':''}</div><div class="dnum">D+${n}</div>`;
    if($("dedit"))$("dedit").onclick=()=>{editingDate=true;render();};
  }else{
    dd.innerHTML=`<div class="lbl"><b style="font-weight:400">우리가 함께한 시간</b><span>첫날을 정하면 D+ 날짜를 세어 드려요.</span></div>${canWrite?'<button class="primary" id="dedit" style="width:auto;padding:10px 16px;font-size:15px">첫날 정하기</button>':'<div class="dnum">D+–</div>'}`;
    if($("dedit"))$("dedit").onclick=()=>{editingDate=true;render();};
  }

  const p=$("panel");
  if(panel&&panel.type==="compose"){
    p.innerHTML=`<form class="compose" id="cform">
      <label for="reason">어떤 점을 칭찬할까요?</label>
      <textarea id="reason" maxlength="120" placeholder="바쁜데도 밥 잘 챙겨 먹었어" required></textarea>
      <div class="tabs" role="tablist">${Object.keys(PRESETS).map(g=>`<button type="button" class="tab" role="tab" aria-selected="${g===presetGroup}" data-g="${g}">${g}</button>`).join("")}</div>
      <div class="chips" id="chips">${PRESETS[presetGroup].map(t=>`<button type="button" class="chip">${t}</button>`).join("")}</div>
      <div class="hint"><span id="len">0</span> / 120</div>
      <div class="row"><button type="button" class="ghost" id="ccancel">취소</button><button class="primary" id="csave">도장 꾹</button></div>
    </form>`;
    const ta=$("reason");
    try{ta.value=localStorage.getItem("yeon-draft")||"";}catch(e){}
    $("len").textContent=ta.value.length;
    ta.oninput=()=>{$("len").textContent=ta.value.length;try{localStorage.setItem("yeon-draft",ta.value);}catch(e){}};
    const bindChips=()=>p.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ta.value=c.textContent;ta.oninput();ta.focus();});
    bindChips();
    p.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{presetGroup=t.dataset.g;p.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));$("chips").innerHTML=PRESETS[presetGroup].map(v=>`<button type="button" class="chip">${v}</button>`).join("");bindChips();});
    $("ccancel").onclick=()=>{panel=null;render();};
    $("cform").onsubmit=async e=>{
      e.preventDefault();const r=ta.value.trim();if(!r)return;
      $("csave").disabled=true;
      try{const id=await store.add(r);try{localStorage.removeItem("yeon-draft");}catch(e){}
        justStamped=id;panel=null;viewBoard=null;render();toast("칭찬 도장을 찍었어요");}
      catch(err){$("csave").disabled=false;toast(writeErr(err));}
    };
    setTimeout(()=>ta.focus(),0);
  }else if(panel&&panel.type==="detail"){
    const idx=stamps.findIndex(s=>s.id===panel.id),s=stamps[idx];
    if(!s){panel=null;p.innerHTML="";}
    else{
      p.innerHTML=`<div class="detail"><div class="meta">${idx+1}번째 칭찬 · ${kstShort.format(new Date(s.at))}</div><p>${esc(s.reason)}</p>
        <div class="row" style="justify-content:space-between;align-items:center">
        ${canWrite?(panel.confirm?`<span style="font-size:13px">이 도장을 지울까요? <button class="danger" id="dyes">지우기</button> <button class="linkbtn" id="dno">그대로 두기</button></span>`:`<button class="danger" id="ddel">도장 지우기</button>`):'<span></span>'}
        <button class="linkbtn" id="dclose">닫기</button></div></div>`;
      $("dclose").onclick=()=>{panel=null;render();};
      if($("ddel"))$("ddel").onclick=()=>{panel.confirm=true;render();};
      if($("dno"))$("dno").onclick=()=>{panel.confirm=false;render();};
      if($("dyes"))$("dyes").onclick=async()=>{const id=panel.id;panel=null;try{await store.remove(id);toast("도장을 지웠어요");}catch(err){toast(writeErr(err));}render();};
    }
  }else p.innerHTML="";

  const sb=$("stampBtn");
  sb.hidden=!canWrite||(panel&&panel.type==="compose");
  sb.textContent=!isLatest?"최신 판으로 가서 도장 찍기":(full?"새 병에 도장 찍기":"칭찬 도장 찍기");

  const lg=$("log");
  if(!stamps.length)lg.innerHTML=`<p class="empty">아직 찍힌 도장이 없어요.<br>첫 칭찬을 남기면 여기에 쌓여요.</p>`;
  else lg.innerHTML="<ol>"+stamps.map((s,i)=>({s,i})).reverse().map(({s,i})=>`<li><span class="no">#${i+1}</span><div class="txt"><p>${esc(s.reason)}</p><time>${kstShort.format(new Date(s.at))}</time></div></li>`).join("")+"</ol>";
}

$("board").addEventListener("click",e=>{
  const b=e.target.closest(".slot");if(!b)return;
  if(b.dataset.id){panel={type:"detail",id:b.dataset.id};render();$("panel").scrollIntoView({behavior:"smooth",block:"nearest"});}
  else if(b.dataset.empty==="1"&&canWrite){panel={type:"compose"};render();$("panel").scrollIntoView({behavior:"smooth",block:"nearest"});}
});
$("stampBtn").onclick=()=>{viewBoard=null;panel={type:"compose"};render();};
$("prev").onclick=()=>{const l=latestBoard(),b=viewBoard===null?l:viewBoard;viewBoard=Math.max(0,b-1);panel=null;render();};
$("next").onclick=()=>{const l=latestBoard(),b=viewBoard===null?l:viewBoard;viewBoard=b+1>=l?null:b+1;panel=null;render();};

function applyData(d){
  if(!d||!Array.isArray(d.stamps))return;
  stamps=d.stamps.filter(s=>s&&typeof s.reason==="string"&&s.at).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  startDate=typeof d.start==="string"?d.start:"";
}
async function api(body){
  const res=await fetch(API_URL,body?{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}:{cache:"no-store"});
  if(!res.ok)throw{code:"network"};
  const d=await res.json(); if(d.error)throw{code:d.error}; return d;
}
function writeErr(err){
  const c=err&&err.code;
  if(c==="pin")return "비밀번호가 맞지 않아요. 다시 확인해 주세요.";
  if(c==="empty")return "칭찬 이유를 적어 주세요.";
  return "저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.";
}
store={
  add:async r=>{const d=await api({action:"add",pin,reason:r});applyData(d);return d.added;},
  remove:async id=>{applyData(await api({action:"remove",pin,id}));},
  setStart:async v=>{applyData(await api({action:"setStart",pin,start:v}));}
};
function renderMode(){
  const m=$("mode"),a=$("admin");
  m.hidden=false; m.textContent=canWrite?"도장 찍는 사람":"조회 전용";
  if(canWrite){
    a.innerHTML=`<button class="linkbtn" id="logout">이 기기에서 도장 찍기 끄기</button>`;
    $("logout").onclick=()=>{pin="";try{localStorage.removeItem(PIN_KEY);}catch(e){}canWrite=false;panel=null;editingDate=false;render();renderMode();};
  }else if(a.dataset.open==="1"){
    a.innerHTML=`<form class="pinform" id="pinform"><label for="pinIn">도장 비밀번호를 넣어 주세요</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" required><button class="primary" id="pinBtn">확인</button><button type="button" class="ghost" id="pinCancel">취소</button></form>`;
    $("pinCancel").onclick=()=>{a.dataset.open="";renderMode();};
    $("pinform").onsubmit=async e=>{
      e.preventDefault();const v=$("pinIn").value.trim();if(!v)return;$("pinBtn").disabled=true;
      try{await api({action:"check",pin:v});pin=v;try{localStorage.setItem(PIN_KEY,v);}catch(e){}canWrite=true;a.dataset.open="";render();renderMode();toast("이제 칭찬 도장을 찍을 수 있어요");}
      catch(err){$("pinBtn").disabled=false;toast(writeErr(err));}
    };
    setTimeout(()=>$("pinIn").focus(),0);
  }else{
    a.innerHTML=`<button class="linkbtn" id="login">칭찬 도장 찍는 사람이에요</button>`;
    $("login").onclick=()=>{a.dataset.open="1";renderMode();};
  }
}
async function refresh(){
  try{applyData(await api());
    $("status").textContent=canWrite?"칭찬을 찍으면 링크를 가진 모두에게 똑같이 보여요.":"보기 전용이에요. 새 칭찬은 1분마다 자동으로 불러와요.";
    if(!panel&&!editingDate)render();
  }catch(e){$("status").textContent="기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.";}
}
render();renderMode();
if(pin){api({action:"check",pin}).then(()=>{canWrite=true;render();renderMode();}).catch(()=>{pin="";try{localStorage.removeItem(PIN_KEY);}catch(e){}});}
refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh();},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});
</script>
</body>
</html>
