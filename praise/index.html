/* Layout: one narrow column — header, D+ card, stamp board (5x6 seals), praise log */
:root{
  /* chips: #DBF0F3 #C4E7ED #98D8E2 #85D3E0 #77CCDB; deep teal derived for readable text */
  --bg:#F3FAFB; --surface:#FFFFFF; --ink:#13303A; --muted:#557580;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --soft:#DBF0F3; --line:#C4E7ED; --seal:#2E9AAE;
  --fill-a:#98D8E2; --fill-b:#77CCDB;
  --display:"Single Day","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --num:"Outfit",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1B20; --surface:#12272E; --ink:#E2F4F7; --muted:#8FB3BC;
  --accent:#85D3E0; --accent-ink:#0C1B20; --soft:#173740; --line:#23474F; --seal:#77CCDB;
  --fill-a:#85D3E0; --fill-b:#C4E7ED; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1B20; --surface:#12272E; --ink:#E2F4F7; --muted:#8FB3BC;
  --accent:#85D3E0; --accent-ink:#0C1B20; --soft:#173740; --line:#23474F; --seal:#77CCDB;
  --fill-a:#85D3E0; --fill-b:#C4E7ED; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.eyebrow{font-family:var(--num);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.15;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0;color:var(--muted);font-size:16px}
.today{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

.dday{background:var(--soft);border-radius:22px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dday .lbl{display:flex;flex-direction:column;gap:2px;min-width:0}
.dday .lbl b{font-weight:400;font-size:15px}
.dday .lbl span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.dnum{font-family:var(--num);font-weight:800;font-size:clamp(36px,11vw,52px);color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dnum small{font-size:.5em;font-weight:700;margin:0 2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.dateform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.dateform input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.pager{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pager button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-size:13px;color:var(--muted);white-space:nowrap}
.progress{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.progress p{margin:0;color:var(--muted);font-size:14px}
.count{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-size:32px;color:var(--accent);font-weight:800}
.count span{color:var(--muted);font-size:15px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fill-a),var(--fill-b));border-radius:99px;transition:width .5s ease}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.slot{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px dashed var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;color:var(--muted);font-family:var(--num);font-size:11px}
.slot svg{width:42%;height:auto}
.slot.next{border-color:var(--accent);color:var(--accent)}
.slot.on{border:0;background:transparent;color:var(--seal);position:relative}
.seal{width:100%;height:100%;display:block;background:var(--seal);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat}
.slot.on.pop .seal{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.6) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
@media (prefers-reduced-motion:reduce){.slot.on.pop .seal{animation:none}.bar i{transition:none}}

.done{background:var(--soft);border-radius:14px;padding:12px 14px;text-align:center;font-family:var(--display);font-size:18px;color:var(--accent)}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px;font-size:16px;font-family:var(--display);width:100%}
.primary:disabled{opacity:.5;cursor:default}

.compose{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:16px;padding:14px}
.compose label{font-size:14px}
.compose textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;color:var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tab{border:0;background:transparent;color:var(--muted);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px}
.row{display:flex;gap:8px}
.row .primary{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.hint{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.detail{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.detail .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail p{margin:0;font-size:16px;overflow-wrap:anywhere}
.danger{color:#C2413B;background:none;border:0;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}

.log{display:flex;flex-direction:column}
.log li{list-style:none;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log ol{margin:0;padding:0}
.no{font-family:var(--num);font-weight:700;color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.log .txt{min-width:0}
.log .txt p{margin:0;overflow-wrap:anywhere}
.log .txt time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:12px 0;margin:0}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 12px;font-size:12px}
.admin{display:flex;justify-content:center}
.pinform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:100%}
.pinform label{font-size:13px;color:var(--muted);width:100%;text-align:center}
.pinform input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:9em}
.pinform .primary{width:auto;padding:10px 16px;font-size:14px}
.pinform .ghost{padding:10px 14px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Praise Stamp Board</div>
    <h1>기특한 우리 <em>연이</em> 칭찬합니다</h1>
    <p class="sub">참 기특해요</p>
    <div class="toprow"><div class="today" id="today"></div><span class="pill" id="mode" hidden></span></div>
  </header>

  <section class="dday" id="dday"></section>

  <section class="card" aria-labelledby="boardTitle">
    <div class="cardhead">
      <h2 id="boardTitle">연이의 칭찬 도장판</h2>
      <div class="pager">
        <button id="prev" aria-label="이전 판">‹</button>
        <span id="boardNo">1번째 판</span>
        <button id="next" aria-label="다음 판">›</button>
      </div>
    </div>
    <div class="progress">
      <p id="progressText"></p>
      <div class="count"><b id="cnt">0</b> <span>/ 30개</span></div>
    </div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="grid" id="grid"></div>
    <div id="doneBox"></div>
    <div id="panel"></div>
    <button class="primary" id="stampBtn">칭찬 도장 찍기</button>
  </section>

  <section class="card" aria-labelledby="logTitle">
    <h2 id="logTitle">칭찬 기록</h2>
    <div class="log" id="log"></div>
  </section>
  <p class="note" id="status">기록을 불러오는 중이에요.</p>
  <div class="admin" id="admin"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const PER = 30;
const PRESETS = {
  "생활": ["밥 잘 챙겨 먹었어","일찍 일어났어","제때 잠들었어","방 청소했어","빨래 다 했어","장 보고 왔어","물 많이 마셨어","알람 듣고 바로 일어났어"],
  "공부·일": ["과제 끝냈어","수업 다 들었어","발표 잘 해냈어","시험 공부했어","토익 공부했어","자소서 한 문단 썼어","미뤄둔 일 처리했어","마감 지켰어"],
  "건강": ["운동 다녀왔어","오래 걸었어","스트레칭했어","영양제 챙겨 먹었어","야식 참았어","병원 잘 다녀왔어"],
  "마음": ["힘든 하루 잘 버텼어","속상한 일 털어놨어","스스로 칭찬해줬어","새로운 거 도전했어","화 안 내고 넘겼어","쉬어야 할 때 잘 쉬었어"],
  "우리": ["먼저 연락해줬어","보고 싶다고 말해줬어","고맙다고 말해줬어","약속 시간 잘 지켰어","내 얘기 잘 들어줬어","깜짝 선물 줬어"]
};
let presetGroup = "생활";
const $ = id => document.getElementById(id);
let stamps = [];           // [{id, reason, at}]
let startDate = "";        // YYYY-MM-DD
let viewBoard = null;      // null = follow latest
let panel = null;          // {type:'compose'} | {type:'detail', id, confirm}
let editingDate = false;
let justStamped = null;
let canWrite = true;
let store = null;          // {add, remove, setStart}

const kst = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"});
const kstShort = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function todayKST(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date());return p;}
function dayDiff(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);}

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400);}

const heart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function latestBoard(){return stamps.length===0?0:Math.floor((stamps.length-1)/PER);}
function render(){
  $("today").textContent = kst.format(new Date())+" · 한국 시간";
  // D-day
  const dd=$("dday");
  if(editingDate){
    dd.innerHTML=`<form class="dateform" id="dform"><label for="startIn">함께한 첫날</label><input type="date" id="startIn" value="${startDate}" max="${todayKST()}" required><button class="primary" style="width:auto;padding:8px 14px;font-size:14px">저장</button><button type="button" class="ghost" id="dcancel" style="padding:8px 12px">취소</button></form>`;
    $("dform").onsubmit=async e=>{e.preventDefault();const v=$("startIn").value;if(!v)return;editingDate=false;startDate=v;render();try{await store.setStart(v);}catch(err){toast("날짜를 저장하지 못했어요. 다시 시도해 주세요.");}};
    $("dcancel").onclick=()=>{editingDate=false;render();};
  } else if(startDate){
    const n=dayDiff(startDate,todayKST())+1;
    const [y,m,d]=startDate.split("-");
    dd.innerHTML=`<div class="lbl"><b>우리가 함께한 시간</b><span>${y}. ${m}. ${d}부터, 오늘까지</span>${canWrite?'<button class="linkbtn" id="dedit" style="align-self:flex-start">날짜 바꾸기</button>':''}</div><div class="dnum">D<small>+</small>${n}</div>`;
    if($("dedit"))$("dedit").onclick=()=>{editingDate=true;render();};
  } else {
    dd.innerHTML=`<div class="lbl"><b>우리가 함께한 시간</b><span>첫날을 정하면 D+ 날짜를 세어 드려요.</span></div>${canWrite?'<button class="primary" id="dedit" style="width:auto;padding:10px 16px;font-size:14px">첫날 정하기</button>':'<div class="dnum">D<small>+</small>–</div>'}`;
    if($("dedit"))$("dedit").onclick=()=>{editingDate=true;render();};
  }

  // Board
  const latest=latestBoard();
  const b = viewBoard===null?latest:Math.min(viewBoard,latest);
  const onBoard = stamps.slice(b*PER,(b+1)*PER);
  const isLatest = b===latest;
  $("boardNo").textContent=`${b+1}번째 판`;
  $("prev").disabled=b===0; $("next").disabled=b>=latest;
  $("cnt").textContent=onBoard.length;
  $("bar").style.width=(onBoard.length/PER*100)+"%";
  const left=PER-onBoard.length;
  $("progressText").textContent = left===0?"한 판을 다 채웠어요!":`칭찬이 ${left}개 더 모이면 한 판 완성이에요.`;
  const full = onBoard.length===PER;
  const nextIdx = isLatest && !full ? onBoard.length : -1;
  let html="";
  for(let i=0;i<PER;i++){
    const s=onBoard[i];
    if(s){
      const rot=((s.id.charCodeAt(0)+i*7)%17)-8;
      html+=`<button class="slot on${justStamped===s.id?" pop":""}" style="--r:${rot}deg" data-id="${s.id}" aria-label="${i+1}번째 칭찬: ${esc(s.reason)}"><span class="seal" style="transform:rotate(${rot}deg)"></span></button>`;
    } else {
      html+=`<button class="slot${i===nextIdx?" next":""}" data-empty="${i===nextIdx?1:0}" aria-label="${i+1}번째 빈 칸">${String(i+1).padStart(2,"0")}${heart}</button>`;
    }
  }
  $("grid").innerHTML=html;
  justStamped=null;
  $("doneBox").innerHTML = full ? `<div class="done">${b+1}번째 판 완성! 연이 정말 기특해</div>` : "";

  // Panel
  const p=$("panel");
  if(panel&&panel.type==="compose"){
    p.innerHTML=`<form class="compose" id="cform">
      <label for="reason">어떤 점을 칭찬할까요?</label>
      <textarea id="reason" maxlength="120" placeholder="예: 바쁜데도 밥 잘 챙겨 먹었어" required></textarea>
      <div class="tabs" role="tablist">${Object.keys(PRESETS).map(g=>`<button type="button" class="tab" role="tab" aria-selected="${g===presetGroup}" data-g="${g}">${g}</button>`).join("")}</div>
      <div class="chips" id="chips">${PRESETS[presetGroup].map(t=>`<button type="button" class="chip">${t}</button>`).join("")}</div>
      <div class="hint"><span id="len">0</span> / 120</div>
      <div class="row"><button type="button" class="ghost" id="ccancel">취소</button><button class="primary" id="csave">도장 꾹</button></div>
    </form>`;
    const ta=$("reason");
    try{ta.value=localStorage.getItem("yeon-draft")||"";}catch(e){}
    $("len").textContent=ta.value.length;
    ta.oninput=()=>{$("len").textContent=ta.value.length;try{localStorage.setItem("yeon-draft",ta.value);}catch(e){}};
    const bindChips=()=>p.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ta.value=c.textContent;ta.oninput();ta.focus();});
    bindChips();
    p.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{presetGroup=t.dataset.g;p.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));$("chips").innerHTML=PRESETS[presetGroup].map(v=>`<button type="button" class="chip">${v}</button>`).join("");bindChips();});
    $("ccancel").onclick=()=>{panel=null;render();};
    $("cform").onsubmit=async e=>{
      e.preventDefault();const r=ta.value.trim();if(!r)return;
      $("csave").disabled=true;
      try{
        const id=await store.add(r);
        try{localStorage.removeItem("yeon-draft");}catch(e){}
        justStamped=id; panel=null; viewBoard=null;
        render(); toast("칭찬 도장을 찍었어요");
      }catch(err){$("csave").disabled=false;toast(writeErr(err));}
    };
    setTimeout(()=>ta.focus(),0);
  } else if(panel&&panel.type==="detail"){
    const idx=stamps.findIndex(s=>s.id===panel.id); const s=stamps[idx];
    if(!s){panel=null;p.innerHTML="";}
    else{
      p.innerHTML=`<div class="detail"><div class="meta">${idx+1}번째 칭찬 · ${kstShort.format(new Date(s.at))}</div><p>${esc(s.reason)}</p>
        <div class="row" style="justify-content:space-between;align-items:center">
        ${canWrite?(panel.confirm?`<span style="font-size:13px">이 도장을 지울까요? <button class="danger" id="dyes">지우기</button> <button class="linkbtn" id="dno">그대로 두기</button></span>`:`<button class="danger" id="ddel">도장 지우기</button>`):'<span></span>'}
        <button class="linkbtn" id="dclose">닫기</button></div></div>`;
      $("dclose").onclick=()=>{panel=null;render();};
      if($("ddel"))$("ddel").onclick=()=>{panel.confirm=true;render();};
      if($("dno"))$("dno").onclick=()=>{panel.confirm=false;render();};
      if($("dyes"))$("dyes").onclick=async()=>{const id=panel.id;panel=null;try{await store.remove(id);toast("도장을 지웠어요");}catch(err){toast(writeErr(err));}render();};
    }
  } else p.innerHTML="";

  const sb=$("stampBtn");
  sb.hidden = !canWrite || (panel&&panel.type==="compose");
  sb.textContent = (isLatest&&full)||(!isLatest) ? (isLatest?"새 판에 도장 찍기":"최신 판으로 가서 도장 찍기") : "칭찬 도장 찍기";

  // Log
  const lg=$("log");
  if(!stamps.length) lg.innerHTML=`<p class="empty">아직 찍힌 도장이 없어요.<br>첫 칭찬을 남기면 여기에 쌓여요.</p>`;
  else lg.innerHTML="<ol>"+stamps.map((s,i)=>({s,i})).reverse().map(({s,i})=>`<li><span class="no">#${i+1}</span><div class="txt"><p>${esc(s.reason)}</p><time>${kstShort.format(new Date(s.at))}</time></div></li>`).join("")+"</ol>";
}

$("grid").addEventListener("click",e=>{
  const b=e.target.closest(".slot");if(!b)return;
  if(b.dataset.id){panel={type:"detail",id:b.dataset.id};render();}
  else if(b.dataset.empty==="1"&&canWrite){panel={type:"compose"};render();}
});
$("stampBtn").onclick=()=>{viewBoard=null;panel={type:"compose"};render();};
$("prev").onclick=()=>{const l=latestBoard();const b=viewBoard===null?l:viewBoard;viewBoard=Math.max(0,b-1);panel=null;render();};
$("next").onclick=()=>{const l=latestBoard();const b=viewBoard===null?l:viewBoard;viewBoard=b+1>=l?null:b+1;panel=null;render();};

// Local fallback (this browser only)
function localStore(){
  const K="yeon-praise-v1";
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{stamps:[],start:""};}catch(e){return {stamps:[],start:""};}};
  const save=d=>{try{localStorage.setItem(K,JSON.stringify(d));}catch(e){}};
  const d=load(); stamps=d.stamps; startDate=d.start;
  return {
    add:async r=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);stamps=[...stamps,{id,reason:r,at:new Date().toISOString()}];save({stamps,start:startDate});return id;},
    remove:async id=>{stamps=stamps.filter(s=>s.id!==id);save({stamps,start:startDate});},
    setStart:async v=>{startDate=v;save({stamps,start:startDate});}
  };
}

// ===== 설정 =====
// Apps Script 웹 앱 주소를 붙여넣으세요. 비워 두면 이 브라우저에만 저장돼요.
const API_URL = "https://script.google.com/macros/s/AKfycbzjj1_T2-3i9IEL6FcKp2LOqsu1msAuL6nBPiHxrvYIvvUWgOXWJ1KEuHKyBJZE2qe3IQ/exec";
// =================

const PIN_KEY = "yeon-pin";
let pin = ""; try{ pin = localStorage.getItem(PIN_KEY) || ""; }catch(e){}

function applyData(d){
  if(!d || !Array.isArray(d.stamps)) return;
  stamps = d.stamps.filter(s=>s && typeof s.reason==="string" && s.at).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  startDate = typeof d.start==="string" ? d.start : "";
}
async function api(body){
  const res = await fetch(API_URL, body ? {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)} : {cache:"no-store"});
  if(!res.ok) throw {code:"network"};
  const d = await res.json();
  if(d.error) throw {code:d.error};
  return d;
}
function writeErr(err){
  const c = err && err.code;
  if(c==="pin") return "비밀번호가 맞지 않아요. 다시 확인해 주세요.";
  if(c==="empty") return "칭찬 이유를 적어 주세요.";
  return "저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.";
}
function remoteStore(){
  return {
    add: async r => { const d = await api({action:"add", pin, reason:r}); applyData(d); return d.added; },
    remove: async id => { applyData(await api({action:"remove", pin, id})); },
    setStart: async v => { applyData(await api({action:"setStart", pin, start:v})); }
  };
}

function renderMode(){
  const m = $("mode"), a = $("admin");
  if(!API_URL){ m.hidden = true; a.innerHTML = ""; return; }
  m.hidden = false;
  m.textContent = canWrite ? "도장 찍는 사람" : "조회 전용";
  if(canWrite){
    a.innerHTML = `<button class="linkbtn" id="logout">이 기기에서 도장 찍기 끄기</button>`;
    $("logout").onclick = () => { pin = ""; try{localStorage.removeItem(PIN_KEY);}catch(e){} canWrite = false; panel = null; editingDate = false; render(); renderMode(); };
  } else if(a.dataset.open === "1"){
    a.innerHTML = `<form class="pinform" id="pinform"><label for="pinIn">도장 비밀번호를 넣어 주세요</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" required><button class="primary" id="pinBtn">확인</button><button type="button" class="ghost" id="pinCancel">취소</button></form>`;
    $("pinCancel").onclick = () => { a.dataset.open = ""; renderMode(); };
    $("pinform").onsubmit = async e => {
      e.preventDefault(); const v = $("pinIn").value.trim(); if(!v) return;
      $("pinBtn").disabled = true;
      try{
        await api({action:"check", pin:v});
        pin = v; try{localStorage.setItem(PIN_KEY, v);}catch(e){}
        canWrite = true; a.dataset.open = ""; render(); renderMode(); toast("이제 칭찬 도장을 찍을 수 있어요");
      }catch(err){ $("pinBtn").disabled = false; toast(writeErr(err)); }
    };
    setTimeout(()=>$("pinIn").focus(), 0);
  } else {
    a.innerHTML = `<button class="linkbtn" id="login">칭찬 도장 찍는 사람이에요</button>`;
    $("login").onclick = () => { a.dataset.open = "1"; renderMode(); };
  }
}

async function refresh(){
  try{
    applyData(await api());
    $("status").textContent = canWrite ? "칭찬을 찍으면 링크를 가진 모두에게 똑같이 보여요." : "보기 전용이에요. 새 칭찬은 1분마다 자동으로 불러와요.";
    if(!panel && !editingDate) render();
  }catch(e){
    $("status").textContent = "기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.";
  }
}

if(!API_URL){
  canWrite = true;
  store = localStore();
  render(); renderMode();
  $("status").textContent = "지금은 이 브라우저에만 저장돼요. API_URL을 넣으면 모두와 연동돼요.";
} else {
  canWrite = false;
  store = remoteStore();
  render(); renderMode();
  if(pin){
    api({action:"check", pin}).then(()=>{ canWrite = true; render(); renderMode(); }).catch(()=>{ pin=""; try{localStorage.removeItem(PIN_KEY);}catch(e){} });
  }
  refresh();
  setInterval(()=>{ if(document.visibilityState==="visible") refresh(); }, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") refresh(); });
}
</script>
