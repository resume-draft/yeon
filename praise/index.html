/* Pawprints: Pet writes, Partner reacts. Four tabs + a floating paw button; the jar art stays as "this month's jar". */
:root{
  --bg:#FBF5EA; --surface:#FFFDF8; --ink:#5B3B2A; --muted:#8C7262; --line:#EADFCB; --soft:#F6ECDC;
  --stamp-ink:#D0675B; --accent:#B8573F; --accent-ink:#FFFFFF;
  --practice:#DED8B4; --practice-ink:#6F6A3E;
  --moment:#F0E0E1; --moment-ink:#A46F78;
  --peach:#F9C99B; --peach-ink:#A8653A; --gold:#E3A93C;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --nav-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.brand{font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:6px}
.brand i{display:inline-block;width:22px;height:22px;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.top .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dnum{font-family:var(--display);color:var(--accent);font-size:17px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:2px 9px;font-size:12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-family:var(--display)}
.primary:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.danger{color:#B23B32;background:none;border:0;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);text-align:center;padding:14px 0;margin:0;font-size:14px}

/* jar */
.board{position:relative;width:100%;aspect-ratio:1696/2528;background:#FCF7EE url("board.webp?v=3") center/100% 100% no-repeat;border-radius:18px;overflow:hidden}
.slot{position:absolute;width:10.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;padding:0}
.slot.on::before{content:"";position:absolute;inset:4%;border-radius:50%;background:rgba(255,253,248,.82)}
.seal{position:absolute;inset:-9%;background:var(--stamp-ink);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat;opacity:.93}
.slot.gold .seal{background:var(--gold)}
.plaque{position:absolute;left:50%;top:94.6%;transform:translate(-50%,-50%);width:28%;text-align:center;font-family:var(--display);color:var(--ink);font-size:clamp(11px,3.4vw,18px);white-space:nowrap;font-variant-numeric:tabular-nums}
.jarcap{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jarcap b{font-family:var(--display);font-weight:400;font-size:18px}
.peek{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.peek p{margin:0;overflow-wrap:anywhere}

/* entry cards */
.feed{display:flex;flex-direction:column;gap:10px}
.dayhead{font-family:var(--display);font-size:15px;color:var(--muted);margin:6px 2px 0}
.ent{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px 20px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.ent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--moment)}
.ent.t-practice::before{background:var(--practice)}
.ent.t-stamp::before{background:var(--stamp-ink)}
.ent.special{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ent .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{border-radius:99px;padding:1px 8px;font-size:12px;background:var(--moment);color:var(--moment-ink)}
.t-practice .tag.type{background:var(--practice);color:var(--practice-ink)}
.t-stamp .tag.type{background:#F6DAD5;color:#9E4237}
.ent .ttl{margin:0;font-size:16px;overflow-wrap:anywhere;font-family:var(--display);font-weight:400;line-height:1.4}
.ent .abc{margin:0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.ent .note{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:10px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.mini{padding:1px 8px;font-size:12px;background:transparent}
.paws{display:inline-flex;gap:2px;vertical-align:middle}
.paws i{width:14px;height:14px;background:var(--line);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.paws i.on{background:var(--peach-ink)}
.stage{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--practice-ink)}
.stage b{width:8px;height:8px;border-radius:50%;background:var(--line)}
.stage b.on{background:var(--practice-ink)}
.reacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.rx{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:2px 9px;font-size:13px;border:0}
.rx .mini-seal{width:16px;height:16px;background:var(--stamp-ink);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat}
.rx.cmt{border-radius:12px;padding:5px 10px;text-align:left;max-width:100%}
.rx.cmt span{overflow-wrap:anywhere}
.who{font-size:11px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.act[aria-pressed="true"]{border-color:var(--gold);background:#FBEFD6}
.emojis{display:flex;gap:4px}
.emojis button{border:0;background:var(--soft);border-radius:10px;font-size:20px;padding:4px 8px}
.inl{display:flex;gap:6px;width:100%}
.inl input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}

/* filters */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 12px;font-size:14px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(91,59,42,.15)}

/* goals */
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px dashed var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.goal .nm{font-family:var(--display);font-size:16px}
.stagebtns{display:flex;gap:4px}
.stagebtns button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:12.5px}
.stagebtns button[aria-pressed="true"]{background:var(--practice);border-color:var(--practice);color:var(--ink)}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
textarea.field{min-height:84px;resize:vertical}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 0 0;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.day.has{background:var(--soft)}
.day.today .n{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 6px}
.day[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.day .pp{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:90%}
.day .pp i{width:11px;height:11px;-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat;background:var(--moment-ink)}
.day .pp i.practice{background:var(--practice-ink)}
.day .pp i.stamp{background:var(--stamp-ink)}
.day .pp i.gold{background:var(--gold)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:11px;height:11px;-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat;display:inline-block}
.shelf{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.minijar{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.minijar[aria-pressed="true"]{border-color:var(--accent)}
.minijar b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--stamp-ink)}
.minijar span{font-size:12px;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,248,.96);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:12px}
.nav a i{width:22px;height:22px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.nav a[aria-current="page"]{color:var(--ink)}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;border:0;background:var(--stamp-ink);box-shadow:0 4px 14px rgba(208,103,91,.35);display:grid;place-items:center;margin-top:-26px}
.fab i{width:30px;height:30px;background:#fff;-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.fab b{position:absolute;margin:30px 0 0 30px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--stamp-ink);font-size:15px;line-height:18px;font-family:var(--display)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(60,40,30,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet label,.sheet .lbl{font-size:13px;color:var(--muted)}
.more{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.more summary{cursor:pointer;color:var(--accent);font-size:14px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.pawpick{display:flex;gap:6px}
.pawpick button{border:0;background:none;padding:2px}
.pawpick i{display:block;width:28px;height:28px;background:var(--line);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.pawpick button[aria-pressed="true"] i{background:var(--peach-ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.burst{position:fixed;left:50%;top:45%;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:40;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat;animation:burst .8s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.3) rotate(-20deg);opacity:0}40%{transform:scale(1.1) rotate(4deg);opacity:.95}100%{transform:scale(1) rotate(0);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{animation-duration:.01s}}

/* gate */
.gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.gate .logo{width:84px;height:84px;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.gate h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.gate form{display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:50}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" hidden aria-label="메뉴"><div class="in">
  <a href="#home" data-v="home" style="--ic:var(--i-home)"><i></i>홈</a>
  <a href="#log" data-v="log" style="--ic:var(--i-log)"><i></i>기록장</a>
  <button class="fab" id="fab" aria-label="새 기록 남기기"><i></i></button>
  <a href="#paw" data-v="paw" style="--ic:var(--paw)"><i></i>발자국</a>
  <a href="#us" data-v="us" style="--ic:var(--i-us)"><i></i>우리</a>
</div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* icons as masks */
(function(){
  const svg=s=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>${s}</svg>`)}")`;
  const r=document.documentElement.style;
  r.setProperty("--paw",svg("<ellipse cx='12' cy='16.2' rx='5.2' ry='4.4'/><ellipse cx='5.2' cy='10.4' rx='2.2' ry='2.8'/><ellipse cx='9.4' cy='6.3' rx='2.2' ry='2.9'/><ellipse cx='14.6' cy='6.3' rx='2.2' ry='2.9'/><ellipse cx='18.8' cy='10.4' rx='2.2' ry='2.8'/>"));
  r.setProperty("--i-home",svg("<path d='M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-5.5H9.2V21H4a1 1 0 0 1-1-1z'/>"));
  r.setProperty("--i-log",svg("<path d='M6 3h10l3 3v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 6v1.6h8V9zm0 4v1.6h8V13zm0 4v1.6h5V17z'/>"));
  r.setProperty("--i-us",svg("<path d='M12 20.5s-7.8-4.6-7.8-10.2A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.8 2.7c0 5.6-7.8 10.2-7.8 10.2z'/>"));
})();

const API_URL="https://script.google.com/macros/s/AKfycbzjj1_T2-3i9IEL6FcKp2LOqsu1msAuL6nBPiHxrvYIvvUWgOXWJ1KEuHKyBJZE2qe3IQ/exec";
const PER=30, XS=[375,617,858,1099,1340], YS=[986,1209,1434,1656,1880,2104], JW=1696, JH=2528;
const TYPE_NAME={practice:"연습",moment:"순간",stamp:"칭찬 도장"};
const CONTEXTS=["부탁받아서","스스로","자연스럽게","놀다가","외출 중","잠들기 전"];
const REINFORCERS=["칭찬","애칭","쓰다듬기","안아주기","함께하는 시간","칭찬 도장","특별 보상"];
const TAGS=["처음 해본 것","취향 발견","기억하고 싶은 날"];
const EMOJIS=["❤️","🐾","🥰","👏","✨"];
const STAGES=["처음 해봄","익숙해짐","자연스러움"];
const STAMP_PRESETS=["밥 잘 챙겨 먹었어","일찍 일어났어","과제 끝냈어","운동 다녀왔어","힘든 하루 잘 버텼어","먼저 연락해줬어","고맙다고 말해줬어","새로운 거 도전했어"];

let key="", role="", data={entries:[],reactions:[],goals:[],settings:{}};
let view="home", logFilter="all", calMonth="", calDay="", openId=null, ui={}, sheet=null, jarPeek=null;
try{key=localStorage.getItem("paw-key")||"";role=localStorage.getItem("paw-role")||"";}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDay=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"});
const fmtTime=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",hour:"numeric",minute:"2-digit"});
const kday=iso=>fmtDay.format(new Date(iso));
const today=()=>fmtDay.format(new Date());
const dayDiff=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);
const list=s=>String(s||"").split("|").filter(Boolean);
const other=()=>role==="pet"?"partner":"pet";
const whoName=r=>r==="pet"?"연이":"파트너";
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400);}
function burst(){const b=document.createElement("div");b.className="burst";document.body.appendChild(b);setTimeout(()=>b.remove(),900);}
function dayLabel(d){const t=today();if(d===t)return"오늘";if(dayDiff(d,t)===1)return"어제";const[y,m,dd]=d.split("-");return`${y===t.slice(0,4)?"":y+". "}${+m}월 ${+dd}일`;}

/* ---------- api ---------- */
async function api(body){
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key})});
  if(!res.ok)throw{code:"network"};
  const d=await res.json(); if(d.error)throw{code:d.error}; return d;
}
function apply(d){
  if(!d||!Array.isArray(d.entries))return;
  const by=(a,b)=>String(a.at).localeCompare(String(b.at));
  data={entries:d.entries.slice().sort(by),reactions:(d.reactions||[]).slice().sort(by),goals:d.goals||[],settings:d.settings||{}};
  if(d.role&&d.role!==role){role=d.role;try{localStorage.setItem("paw-role",role);}catch(e){}}
}
function errMsg(e){const c=e&&e.code;if(c==="pin")return"비밀번호가 맞지 않아요.";if(c==="forbidden")return"직접 남긴 것만 고칠 수 있어요.";if(c==="empty")return"한 줄은 꼭 적어 주세요.";return"저장하지 못했어요. 연결을 확인해 주세요.";}
async function write(body,okMsg){try{const d=await api(body);apply(d);render();if(okMsg)toast(okMsg);return d;}catch(e){toast(errMsg(e));throw e;}}
function notify(to,message){
  const topic=data.settings[to==="pet"?"ntfy_pet":"ntfy_partner"]; if(!topic)return;
  try{fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic,title:"Pawprints",message,tags:["paw_prints"],click:location.href.split("#")[0].split("?")[0]+"#log"})}).catch(()=>{});}catch(e){}
}

/* ---------- derived ---------- */
const reactsOf=id=>data.reactions.filter(r=>r.entry_id===id);
function monthStamps(ym){
  const a=data.entries.filter(e=>e.type==="stamp"&&kday(e.at).slice(0,7)===ym).map(e=>({at:e.at,text:e.title,gold:e.special==="1",entry:e.id}));
  const b=data.reactions.filter(r=>r.kind==="stamp"&&kday(r.at).slice(0,7)===ym).map(r=>{const e=data.entries.find(x=>x.id===r.entry_id);return{at:r.at,text:e?`「${e.title}」에 찍은 도장`:"칭찬 도장",gold:!!(e&&e.special==="1"),entry:r.entry_id};});
  return a.concat(b).sort((x,y)=>String(x.at).localeCompare(String(y.at)));
}
function stageBadge(n){n=+n||0;return n?`<span class="stage" title="${STAGES[n-1]}">${[1,2,3].map(i=>`<b class="${i<=n?"on":""}"></b>`).join("")} ${STAGES[n-1]}</span>`:"";}
function pawsBadge(n){n=+n||0;return n?`<span class="paws" aria-label="만족도 ${n}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`:"";}

/* ---------- entry card ---------- */
function entryCard(e,opts={}){
  const rx=reactsOf(e.id), open=openId===e.id, mine=e.author===role, goal=data.goals.find(g=>g.id===e.goal_id);
  const ctx=list(e.context), rf=list(e.reinforcers), tags=list(e.tags);
  let abc="";
  if(ctx.length||rf.length)abc=`<p class="abc">${ctx.length?esc(ctx.join(", "))+"에 → ":""}${goal?"「"+esc(goal.name)+"」 ":""}${rf.length?"→ 받은 것: "+esc(rf.join(", ")):""}</p>`;
  else if(goal)abc=`<p class="abc">연습: ${esc(goal.name)}</p>`;
  const meta=[pawsBadge(e.mood),e.type==="practice"?stageBadge(e.stage):"",e.paused==="1"?`<span class="tag" style="background:var(--soft);color:var(--muted)">오늘은 여기까지</span>`:""].filter(Boolean).join(" ");
  const rxHtml=rx.map(r=>{
    const del=r.author===role?` data-unreact="${r.id}"`:"";
    if(r.kind==="stamp")return`<button class="rx"${del} title="${whoName(r.author)}의 칭찬 도장"><span class="mini-seal"></span>도장</button>`;
    if(r.kind==="emoji")return`<button class="rx"${del} title="${whoName(r.author)}">${esc(r.value)}</button>`;
    return`<button class="rx cmt"${del}><span><span class="who">${whoName(r.author)}</span> ${esc(r.value)}</span></button>`;
  }).join("");
  const u=ui[e.id]||{};
  let acts="";
  if(role==="partner"&&e.author==="pet"){
    const stamped=rx.some(r=>r.kind==="stamp"&&r.author==="partner");
    acts+=`<button class="act" data-stamp="${e.id}"${stamped?" disabled":""}><span class="mini-seal" style="width:16px;height:16px;background:var(--stamp-ink);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat;display:inline-block"></span>${stamped?"찍음":"도장"}</button>`;
  }
  acts+=`<button class="act" data-emo="${e.id}">😊 이모지</button><button class="act" data-cmt="${e.id}">💬 한 줄</button>`;
  if(role==="partner")acts+=`<button class="act" data-star="${e.id}" aria-pressed="${e.special==="1"}">⭐ 특별한 순간</button>`;
  let extra="";
  if(u.emo)extra+=`<div class="emojis">${EMOJIS.map(x=>`<button data-emopick="${e.id}" data-v="${x}" aria-label="${x}">${x}</button>`).join("")}</div>`;
  if(u.cmt)extra+=`<form class="inl" data-cmtform="${e.id}"><input maxlength="120" placeholder="한 줄 남기기" aria-label="한 줄 남기기"><button class="ghost" style="padding:6px 12px">보내기</button></form>`;
  let detail="";
  if(open){
    if(e.note)detail+=`<p class="note">${esc(e.note)}</p>`;
    if(mine){
      if(u.edit)detail+=`<form class="inl" data-editform="${e.id}" style="flex-direction:column"><input class="field" name="t" maxlength="120" value="${esc(e.title)}" aria-label="한 줄"><textarea class="field" name="n" maxlength="500" placeholder="메모" aria-label="메모">${esc(e.note)}</textarea><div class="row"><button class="ghost" type="button" data-editcancel="${e.id}">취소</button><button class="primary" style="padding:8px 14px;font-size:15px">저장</button></div></form>`;
      else detail+=`<div class="row between"><button class="linkbtn" data-edit="${e.id}">고치기</button>${u.del?`<span class="small">지울까요? <button class="danger" data-delyes="${e.id}">지우기</button> <button class="linkbtn" data-delno="${e.id}">그대로 두기</button></span>`:`<button class="danger" data-del="${e.id}">지우기</button>`}</div>`;
    }
  }
  return`<article class="ent t-${e.type}${e.special==="1"?" special":""}" data-open="${e.id}">
    <div class="hd"><span class="tag type">${TYPE_NAME[e.type]||"순간"}</span><span>${opts.showDay?dayLabel(kday(e.at))+" ":""}${fmtTime.format(new Date(e.at))}</span><span>· ${whoName(e.author)}</span>${e.special==="1"?`<span style="margin-left:auto;color:var(--gold)">⭐ 특별한 순간</span>`:""}</div>
    <h3 class="ttl">${esc(e.title)}</h3>${abc}
    ${meta?`<div class="row">${meta}</div>`:""}
    ${tags.length?`<div class="chips">${tags.map(t=>`<span class="chip mini">${esc(t)}</span>`).join("")}</div>`:""}
    ${detail}
    ${rxHtml?`<div class="reacts">${rxHtml}</div>`:""}
    <div class="acts">${acts}</div>${extra}
  </article>`;
}

/* ---------- views ---------- */
function vHome(){
  const t=today(), ym=t.slice(0,7), st=monthStamps(ym), start=data.settings.start;
  let slots="";
  for(let i=0;i<PER;i++){const x=XS[i%5]/JW*100,y=YS[Math.floor(i/5)]/JH*100,s=st[i];
    if(s){const rot=((i*37)%21)-10;slots+=`<button class="slot on${s.gold?" gold":""}" style="left:${x}%;top:${y}%" data-jar="${i}" aria-label="${i+1}번 도장: ${esc(s.text)}"><span class="seal" style="transform:rotate(${rot}deg)"></span></button>`;}
  }
  const [yy,mm,dd]=t.split("-");
  let h=`<section aria-label="이번 달의 병" style="display:flex;flex-direction:column;gap:8px">
    <div class="jarcap"><b>${+mm}월의 병</b><span class="small muted">칭찬 도장 ${st.length}개${st.length>PER?" (병에는 30개까지)":""}</span></div>
    <div class="board" id="jar">${slots}<div class="plaque" aria-label="오늘 날짜">${yy}. ${mm}. ${dd}</div></div>
    ${jarPeek!=null&&st[jarPeek]?`<div class="peek"><p>${esc(st[jarPeek].text)}<br><span class="small muted">${dayLabel(kday(st[jarPeek].at))} ${fmtTime.format(new Date(st[jarPeek].at))}</span></p><button class="linkbtn" id="peekx">닫기</button></div>`:""}
  </section>`;
  if(role==="partner")h+=`<button class="primary" id="quickStamp">칭찬 도장 찍기</button>`;
  // recent from the other person
  const since=Date.now()-14*864e5;
  if(role==="pet"){
    const rs=data.reactions.filter(r=>r.author==="partner"&&Date.parse(r.at)>since).slice(-3).reverse();
    const ss=data.entries.filter(e=>e.author==="partner"&&Date.parse(e.at)>since).slice(-2).reverse();
    if(rs.length||ss.length){
      h+=`<section class="card"><h2>최근 받은 반응</h2>${ss.map(e=>`<div class="peek"><p>${e.type==="stamp"?"칭찬 도장":"순간 기록"} · ${esc(e.title)}</p><span class="small muted">${dayLabel(kday(e.at))}</span></div>`).join("")}${rs.map(r=>{const e=data.entries.find(x=>x.id===r.entry_id);const what=r.kind==="stamp"?"칭찬 도장":r.kind==="emoji"?r.value:"“"+r.value+"”";return`<div class="peek"><p>${esc(what)} <span class="muted small">— ${e?"「"+esc(e.title)+"」":"기록"}</span></p><span class="small muted">${dayLabel(kday(r.at))}</span></div>`;}).join("")}</section>`;
    }
  }else{
    const es=data.entries.filter(e=>e.author==="pet").slice(-3).reverse();
    if(es.length)h+=`<section style="display:flex;flex-direction:column;gap:10px"><h2>연이의 최근 기록</h2><div class="feed">${es.map(e=>entryCard(e,{showDay:true})).join("")}</div></section>`;
  }
  const goals=data.goals.filter(g=>g.active==="1");
  if(goals.length)h+=`<section class="card"><div class="row between"><h2>연습 중인 것</h2><a class="linkbtn" href="#us">관리</a></div>${goals.map(g=>`<div class="goal"><span class="nm">${esc(g.name)}</span>${stageBadge(g.stage)}${g.next_step?`<span class="small muted">다음: ${esc(g.next_step)}</span>`:""}</div>`).join("")}</section>`;
  // on this day
  const ly=(+yy-1)+t.slice(4), lm=new Date(Date.UTC(+yy,+mm-2,+dd)).toISOString().slice(0,10);
  const mem=data.entries.find(e=>kday(e.at)===ly)||data.entries.find(e=>kday(e.at)===lm);
  if(mem)h+=`<section class="peek" style="background:var(--moment)"><p><span class="small muted">${kday(mem.at)===ly?"1년 전 오늘":"한 달 전 오늘"}</span><br>${esc(mem.title)}</p></section>`;
  if(!data.entries.length)h+=`<section class="card"><p class="empty">아직 기록이 없어요.<br>아래 발바닥 버튼으로 첫 기록을 남겨 보세요.</p></section>`;
  return h;
}

function vLog(){
  const f=[["all","전체"],["practice","연습"],["moment","순간"],["stamp","칭찬 도장"],["special","특별한 순간"]];
  let es=data.entries.slice().reverse();
  if(logFilter==="special")es=es.filter(e=>e.special==="1");else if(logFilter!=="all")es=es.filter(e=>e.type===logFilter);
  let h=`<h2>기록장</h2><div class="seg" role="tablist" aria-label="기록 종류">${f.map(([k,t])=>`<button role="tab" data-filter="${k}" aria-selected="${k===logFilter}">${t}</button>`).join("")}</div>`;
  if(!es.length)return h+`<p class="empty">아직 이 종류의 기록이 없어요.</p>`;
  let last="";h+=`<div class="feed">`;
  es.forEach(e=>{const d=kday(e.at);if(d!==last){h+=`<div class="dayhead">${dayLabel(d)}</div>`;last=d;}h+=entryCard(e);});
  return h+`</div>`;
}

function vPaw(){
  const t=today(); if(!calMonth)calMonth=t.slice(0,7);
  const [y,m]=calMonth.split("-").map(Number), first=new Date(Date.UTC(y,m-1,1)), days=new Date(Date.UTC(y,m,0)).getUTCDate(), lead=first.getUTCDay();
  const byDay={}; data.entries.forEach(e=>{const d=kday(e.at);(byDay[d]=byDay[d]||[]).push(e);});
  let cells=["일","월","화","수","목","금","토"].map(d=>`<div class="dow">${d}</div>`).join("")+"<div></div>".repeat(lead);
  for(let d=1;d<=days;d++){const ds=`${calMonth}-${String(d).padStart(2,"0")}`,es=byDay[ds]||[];
    const pp=es.slice(0,4).map(e=>`<i class="${e.special==="1"?"gold":e.type}"></i>`).join("");
    cells+=`<button class="day${es.length?" has":""}${ds===t?" today":""}" data-day="${ds}" aria-pressed="${ds===calDay}" aria-label="${m}월 ${d}일, 기록 ${es.length}개"><span class="n">${d}</span><span class="pp">${pp}</span></button>`;}
  const mes=data.entries.filter(e=>kday(e.at).slice(0,7)===calMonth);
  const sum=`발자국 ${mes.length}개 · 칭찬 도장 ${monthStamps(calMonth).length}개 · 특별한 순간 ${mes.filter(e=>e.special==="1").length}개`;
  let h=`<h2>발자국</h2><section class="card"><div class="calhead"><button id="calPrev" aria-label="이전 달">‹</button><h3>${y}년 ${m}월</h3><button id="calNext" aria-label="다음 달">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:var(--practice-ink)"></i>연습</span><span><i style="background:var(--moment-ink)"></i>순간</span><span><i style="background:var(--stamp-ink)"></i>칭찬 도장</span><span><i style="background:var(--gold)"></i>특별한 순간</span></div>
    <p class="small muted" style="margin:0">${sum}</p></section>`;
  if(calDay&&calDay.slice(0,7)===calMonth){const es=(byDay[calDay]||[]).slice().reverse();h+=`<section style="display:flex;flex-direction:column;gap:10px"><h3>${dayLabel(calDay)}</h3>${es.length?`<div class="feed">${es.map(e=>entryCard(e)).join("")}</div>`:`<p class="empty">이날은 조용히 지나갔어요.</p>`}</section>`;}
  // shelf of jars
  const months=[...new Set(data.entries.map(e=>kday(e.at).slice(0,7)).concat(data.reactions.map(r=>kday(r.at).slice(0,7))))].sort();
  if(months.length)h+=`<section class="card"><h3>유리병 선반</h3><div class="shelf">${months.reverse().map(mo=>`<button class="minijar" data-month="${mo}" aria-pressed="${mo===calMonth}"><b>${monthStamps(mo).length}</b><span>${mo.slice(0,4)!==t.slice(0,4)?mo.slice(2,4)+"년 ":""}${+mo.slice(5)}월</span></button>`).join("")}</div><p class="small muted" style="margin:0">숫자는 그달 병에 담긴 칭찬 도장이에요.</p></section>`;
  return h;
}

function vUs(){

  const goalRow=g=>`<div class="goal"><div class="row between"><span class="nm">${esc(g.name)}</span>${g.active==="1"?`<button class="linkbtn" data-rest="${g.id}">충분해요</button>`:`<button class="linkbtn" data-wake="${g.id}">다시 시작</button>`}</div>
    <div class="stagebtns" role="group" aria-label="단계">${STAGES.map((s,i)=>`<button data-gstage="${g.id}" data-v="${i+1}" aria-pressed="${+g.stage===i+1}">${s}</button>`).join("")}</div>
    <form class="inl" data-nextform="${g.id}"><input maxlength="80" value="${esc(g.next_step)}" placeholder="다음에 해보고 싶은 것" aria-label="다음 단계"><button class="ghost" style="padding:6px 12px">저장</button></form></div>`;
  let h=`<h2>우리</h2><section class="card"><h3>연습 중인 것</h3>${act.length?act.map(goalRow).join(""):`<p class="empty">아직 연습 목표가 없어요.</p>`}
    <form class="inl" id="goalAdd"><input maxlength="40" placeholder="새 연습 목표" aria-label="새 연습 목표"><button class="ghost" style="padding:6px 12px">추가</button></form>

    <p class="small muted" style="margin:0">"충분해요"로 내려놓아도 실패로 남지 않아요.</p></section>`;
  const ag=data.settings.agreements||"";
  h+=`<section class="card"><h3>우리의 약속</h3><p class="small muted" style="margin:0">함께 정한 규칙, 멈춤 신호, 하고 싶지 않은 것. 둘 중 누구든 언제든 바꿀 수 있어요.</p>
    <textarea class="field" id="agree" maxlength="2000" placeholder="예: 멈춤 신호는 '노란불'. 멈추자고 하면 이유를 묻지 않기." aria-label="우리의 약속">${esc(ag)}</textarea>
    <div class="row between"><span class="small muted">${data.settings.agreements_at?"마지막 수정 "+dayLabel(kday(data.settings.agreements_at)):""}</span><button class="ghost" id="agreeSave">저장</button></div></section>`;
  const tagged=t=>data.entries.filter(e=>list(e.tags).includes(t)).slice().reverse();
  [["취향 발견","발견한 취향"],["처음 해본 것","처음 해본 것"]].forEach(([t,title])=>{const es=tagged(t);h+=`<section class="card"><h3>${title}</h3>${es.length?`<div class="chips">${es.map(e=>`<button class="chip" data-goto="${e.id}">${esc(e.title)}</button>`).join("")}</div>`:`<p class="empty">기록에 "${t}" 칩을 붙이면 여기 모여요.</p>`}</section>`;});
  const start=data.settings.start||"";
  h+=`<section class="card"><h3>함께한 첫날</h3><form class="inl" id="startForm"><input type="date" class="field" value="${esc(start)}" max="${today()}" aria-label="함께한 첫날"><button class="ghost" style="padding:6px 12px">저장</button></form></section>`;
  const topic=data.settings[role==="pet"?"ntfy_pet":"ntfy_partner"];
  if(topic)h+=`<section class="card"><h3>알림 받기</h3><p class="small muted" style="margin:0">${role==="pet"?"파트너가 반응하거나 도장을 찍으면":"연이가 새 기록을 남기면"} ntfy 앱으로 알려드려요. 알림에는 내용이 들어가지 않아요. ntfy 앱에서 이 주제를 구독하세요.</p><div class="row"><span class="code" id="topic">${esc(topic)}</span><button class="ghost" id="copyTopic" style="padding:6px 12px">복사</button></div></section>`;
  h+=`<div class="row between small muted"><span>${role==="pet"?"연이(Pet)":"파트너"}로 들어와 있어요</span><button class="linkbtn" id="logout">이 기기에서 나가기</button></div>`;
  return h;
}

/* ---------- sheet (quick record) ---------- */
function openSheet(type){
  const types=role==="pet"?["practice","moment"]:["stamp","moment"];
  sheet={type:type&&types.includes(type)?type:types[0],types,title:"",goal:"",context:[],reinforcers:[],mood:0,stage:0,paused:false,tags:[],note:""};
  try{const d=JSON.parse(sessionStorage.getItem("paw-draft")||"null");if(d&&d.title&&d.role===role)Object.assign(sheet,d.s,{types});}catch(e){}
  renderSheet(true);
}
function saveDraft(){try{sessionStorage.setItem("paw-draft",JSON.stringify({role,s:sheet}));}catch(e){}}

    ${s.type==="stamp"?`<div class="chips">${STAMP_PRESETS.map(p=>`<button type="button" class="chip" data-preset="${esc(p)}">${esc(p)}</button>`).join("")}</div>`:""}
    <details class="more" ${s.open?"open":""} id="more"><summary>${s.open?"접기":"더 남기기 (선택)"}</summary>
      ${s.type!=="stamp"?`<span class="lbl">어떤 상황이었나요?</span>${multi(s.context,"context",CONTEXTS)}

function closeSheet(){sheet=null;renderSheet();}
document.addEventListener("click",e=>{
  if(!sheet)return; const t=e.target;
  if(t.id==="scrim"||t.id==="scancel"){closeSheet();return;}
  const b=t.closest("button"); if(!b||!$("sheetForm").contains(b))return;
  const s=sheet;
  if(b.dataset.stype){s.title=$("stitle").value;s.type=b.dataset.stype;renderSheet();}
  else if(b.dataset.goal){s.goal=s.goal===b.dataset.goal?"":b.dataset.goal;b.setAttribute("aria-pressed",String(s.goal===b.dataset.goal));$("sheetForm").querySelectorAll("[data-goal]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.goal===s.goal)));}
  else if(b.dataset.multi){const a=s[b.dataset.multi],v=b.dataset.v,i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);b.setAttribute("aria-pressed",String(i<0));}
  else if(b.dataset.mood){const n=+b.dataset.mood;s.mood=s.mood===n?0:n;$("sheetForm").querySelectorAll("[data-mood]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.mood<=s.mood)));}

  else if(b.dataset.preset){$("stitle").value=b.dataset.preset;s.title=b.dataset.preset;}
  saveDraft();
});
document.addEventListener("input",e=>{if(!sheet)return;if(e.target.id==="stitle")sheet.title=e.target.value;if(e.target.id==="snote")sheet.note=e.target.value;if(e.target.id==="spaused")sheet.paused=e.target.checked;saveDraft();});

document.addEventListener("submit",async e=>{
  if(e.target.id!=="sheetForm")return; e.preventDefault();
  const s=sheet; s.title=$("stitle").value.trim(); if(!s.title){toast("한 줄은 꼭 적어 주세요.");return;}

    closeSheet();burst();toast(s.type==="stamp"?"칭찬 도장을 찍었어요":"발자국을 남겼어요");

  catch(x){btn.disabled=false;}
},true);

});
function confirmTap(b,msg){if(b.dataset.armed){return true;}b.dataset.armed="1";const old=b.innerHTML;b.innerHTML=msg;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML=old;}},2500);return false;}

function route(){const h=location.hash.replace("#","");view=["home","log","paw","us"].includes(h)?h:"home";openId=null;jarPeek=null;render();window.scrollTo(0,0);}
window.addEventListener("hashchange",route);
async function refresh(){
  if(!key)return;
  try{apply(await api({action:"read"}));
    const busy=sheet||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName));
    if(!busy)render();}
  catch(e){if(e&&e.code==="pin"){key="";role="";try{localStorage.removeItem("paw-key");}catch(x){}render();toast("비밀번호가 바뀌었어요. 다시 들어와 주세요.");}}
}
route();
if(key)refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh();},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});
</script>
