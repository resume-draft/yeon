/* Pawprints v2: three tabs (오늘 · 기록 · 우리). The partner leads (orders, rules, stamps); 연이 records and signals. */
:root{
  --bg:#FBF5EA; --surface:#FFFDF8; --ink:#5B3B2A; --muted:#8C7262; --line:#EADFCB; --soft:#F6ECDC;
  --stamp-ink:#D0675B; --accent:#B8573F; --accent-ink:#FFFFFF;
  --sage:#DED8B4; --sage-ink:#6F6A3E; --blush:#F0E0E1; --blush-ink:#A46F78; --peach:#F9C99B; --peach-ink:#A8653A; --gold:#E3A93C;
  --green:#7FA36B; --yellow:#E2B23E; --red:#C9574B;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --nav-h:60px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0}
h3{font-family:var(--display);font-weight:400;font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.brand{font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:6px}
.brand i,.paw{display:inline-block;width:22px;height:22px;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.top .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dnum{font-family:var(--display);color:var(--accent);font-size:17px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 9px;font-size:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-family:var(--display);font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.soft{background:var(--soft);color:var(--ink)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.danger{background:none;border:0;padding:0;color:#B23B32;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
textarea.field{min-height:70px;resize:vertical}
.inl{display:flex;gap:6px;width:100%}
.inl .field{flex:1;min-width:0}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:6px 0}

/* signal */
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sig button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 4px;display:flex;justify-content:center;align-items:center}
.sig button i{width:30px;height:30px;border-radius:50%;background:var(--c);opacity:.35}
.sig button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.sig button[aria-pressed="true"] i{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.sigview{display:flex;align-items:center;gap:14px;padding:5px}
.sigview i{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.sigview b{font-family:var(--display);font-weight:400;font-size:18px}
.card.alert{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--surface))}

/* order */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;font-size:12px;color:var(--sage-ink);min-width:0}
.wd i{width:32px;height:32px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--sage-ink) 35%,transparent);background:var(--surface);display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px}
.wd[aria-pressed="true"] i{background:var(--sage-ink);border-color:var(--sage-ink)}
.wd.now span{font-weight:700;color:var(--ink)}
.wd.fut{opacity:.4}
.wd:disabled{cursor:default}
.wcount{font-size:13px;color:var(--sage-ink)}
.order{background:var(--sage);border-color:transparent}
.order .txt{font-family:var(--display);font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.order .from{font-size:12px;color:var(--sage-ink)}

/* question */
.q{font-family:var(--display);font-size:18px;line-height:1.4}
.ans{background:var(--soft);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.ans .who{font-size:12px;color:var(--muted)}
.ans p{overflow-wrap:anywhere;white-space:pre-wrap}

/* jar */
.board{position:relative;width:100%;aspect-ratio:1696/2528;background:#FCF7EE url("board.webp?v=3") center/100% 100% no-repeat;border-radius:18px;overflow:hidden}
.slot{position:absolute;width:10.6%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;padding:0}
.slot.on::before{content:"";position:absolute;inset:4%;border-radius:50%;background:rgba(255,253,248,.82)}
.seal{position:absolute;inset:-9%;background:var(--stamp-ink);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat;opacity:.93}
.plaque{position:absolute;left:50%;top:94.6%;transform:translate(-50%,-50%);width:28%;text-align:center;font-family:var(--display);font-size:clamp(11px,3.4vw,18px);white-space:nowrap;font-variant-numeric:tabular-nums}
.jarcap{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jarcap b{font-family:var(--display);font-weight:400;font-size:18px}
.reward{background:var(--peach);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.reward p{overflow-wrap:anywhere}
.fold{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.fold h3{margin:0}
.peek{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.peek p{margin:0;min-width:0;flex:1;word-break:keep-all;overflow-wrap:anywhere}
.peek #peekx{flex:none;align-self:flex-start;white-space:nowrap;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);text-decoration:none;line-height:1.6}

/* feed */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:4px;align-self:flex-start}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:7px 14px;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(91,59,42,.15)}
.dayhead{font-family:var(--display);font-size:15px;color:var(--muted);margin:6px 2px 0}
.feed{display:flex;flex-direction:column;gap:10px}
.ent{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ent .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tag{border-radius:99px;padding:1px 8px;font-size:12px;background:var(--blush);color:var(--blush-ink);white-space:nowrap}
.tag.stamp{background:#F6DAD5;color:#9E4237}
.tag.order{background:var(--sage);color:var(--sage-ink)}
.tag.answer{background:var(--peach);color:var(--peach-ink)}
.ent .txt{overflow-wrap:anywhere;white-space:pre-wrap}
.ent .sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.mini-seal{display:inline-block;width:18px;height:18px;background:var(--stamp-ink);-webkit-mask:var(--stamp) center/contain no-repeat;mask:var(--stamp) center/contain no-repeat;vertical-align:-4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 11px;font-size:13px}
.act[aria-pressed="true"]{background:#F6DAD5;border-color:#F6DAD5;color:#9E4237}
.act.h-pet{color:#B9A99B}.act.h-partner{color:#B9A99B}
.act.h-pet[aria-pressed="true"]{background:#F8DCD6;border-color:#E9A69B;color:#C9503F}
.act.h-partner[aria-pressed="true"]{background:#D3EBEF;border-color:#86C2CE;color:#2E8597}
span.act small{font-size:11px;margin-left:2px}
.cmts{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:6px}
.cmts p{font-size:13.5px;overflow-wrap:anywhere}
.cmts b{font-weight:400;color:var(--muted);font-size:12px;margin-right:4px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted)}
.day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 0;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:0}
.day.has{background:var(--soft)}
.day.today .n{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 6px}
.day[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.day .pp{display:flex;gap:1px;flex-wrap:wrap;justify-content:center}
.day .pp i{width:10px;height:10px;-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat;background:var(--blush-ink)}
.day .pp i.stamp{background:var(--stamp-ink)} .day .pp i.order{background:var(--sage-ink)} .day .pp i.answer{background:var(--peach-ink)}

/* lists */
.li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li .t.done{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);flex:none;display:grid;place-items:center;font-size:13px;padding:0}
.check[aria-pressed="true"]{background:var(--sage);border-color:var(--sage)}
.badge{font-size:11px;border-radius:99px;padding:1px 7px;background:var(--soft);color:var(--muted);white-space:nowrap}
.shelf{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.minijar{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;min-width:70px}
.minijar b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--stamp-ink)}
.minijar span{font-size:12px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px;overflow-wrap:anywhere}

/* nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,248,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:4px max(10px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);text-decoration:none;font-size:12px}
.nav a i{width:22px;height:22px;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.nav a[aria-current="page"]{color:var(--ink)}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));
  height:52px;border-radius:26px;border:0;background:var(--stamp-ink);color:#fff;padding:0 18px 0 14px;display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16px;box-shadow:0 4px 14px rgba(208,103,91,.35)}
.fab i{width:22px;height:22px;background:#fff;-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}

.scrim{position:fixed;inset:0;background:rgba(60,40,30,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px}
.burst{position:fixed;left:50%;top:45%;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:40;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat;animation:burst .8s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.1);opacity:.95}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{animation-duration:.01s}}
[hidden]{display:none!important}
.gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.gate .logo{width:84px;height:84px;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.gate h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.gate form,.gate .who{display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
.gate .who button{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit;cursor:pointer}
.gate .who button b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.gate .who button span{font-size:13px;color:var(--muted)}
.gate .who i{width:34px;height:34px;flex:none;background:var(--stamp-ink);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat}
.gate .who .p i{background:var(--ink)}
.pill.me{border:0;font:inherit;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:50}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" hidden><i></i><span id="fabTxt">한 줄 남기기</span></button>
<nav class="nav" id="nav" hidden aria-label="메뉴"><div class="in">
  <a href="#today" data-v="today" style="--ic:var(--i-home)"><i></i>오늘</a>
  <a href="#log" data-v="log" style="--ic:var(--i-log)"><i></i>기록</a>
  <a href="#us" data-v="us" style="--ic:var(--i-us)"><i></i>우리</a>
</div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const svg=s=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'>${s}</svg>`)}")`;
  const r=document.documentElement.style;
  r.setProperty("--paw",svg("<ellipse cx='12' cy='16.2' rx='5.2' ry='4.4'/><ellipse cx='5.2' cy='10.4' rx='2.2' ry='2.8'/><ellipse cx='9.4' cy='6.3' rx='2.2' ry='2.9'/><ellipse cx='14.6' cy='6.3' rx='2.2' ry='2.9'/><ellipse cx='18.8' cy='10.4' rx='2.2' ry='2.8'/>"));
  r.setProperty("--i-home",svg("<path d='M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-5.5H9.2V21H4a1 1 0 0 1-1-1z'/>"));
  r.setProperty("--i-log",svg("<path d='M6 3h10l3 3v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 6v1.6h8V9zm0 4v1.6h8V13zm0 4v1.6h5V17z'/>"));
  r.setProperty("--i-us",svg("<path d='M12 20.5s-7.8-4.6-7.8-10.2A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.8 2.7c0 5.6-7.8 10.2-7.8 10.2z'/>"));
})();

const API_URL="https://script.google.com/macros/s/AKfycbzjj1_T2-3i9IEL6FcKp2LOqsu1msAuL6nBPiHxrvYIvvUWgOXWJ1KEuHKyBJZE2qe3IQ/exec";
const PER=30, XS=[375,617,858,1099,1340], YS=[986,1209,1434,1656,1880,2104], JW=1696, JH=2528;
const NAME={pet:"연이",partner:"파트너"};
const SIGNALS={green:["좋아요","좋아요","var(--green)"],yellow:["살살","살살 부탁해요","var(--yellow)"],red:["쉴래요","오늘은 쉬고 싶어요","var(--red)"]};
const TYPE={stamp:"칭찬 도장",order:"지시",answer:"오늘의 질문",note:"한 줄",practice:"한 줄",moment:"한 줄"};
const STAMP_PRESETS=["말 잘 들었어","약속 잘 지켰어","밥 잘 챙겨 먹었어","일찍 잤어","솔직하게 말해줘서 고마워","오늘 하루 잘 버텼어"];
const QUESTIONS=["오늘 가장 칭찬받고 싶은 일은?","최근에 들은 말 중 가장 힘이 된 말은?","요즘 우리 약속 중 지키기 제일 쉬운 건? 어려운 건?","오늘 컨디션을 날씨로 표현하면?","다음에 같이 해보고 싶은 것 하나","어떤 칭찬을 들을 때 가장 좋아?","상대가 나를 챙겨준다고 느끼는 순간은?","이번 주에 고마웠던 순간 하나","요즘 새로 생긴 습관이 있어?","지금 가장 먹고 싶은 건?","우리 관계에 새로 넣고 싶은 약속이 있다면?","처음 만났을 때 첫인상은?","혼날 때(?) 가장 효과 있는 방법은?","오늘 잘한 일 세 가지","상대의 어떤 모습이 가장 멋있어?","힘들 때 상대가 해줬으면 하는 것","이번 달에 꼭 같이 하고 싶은 것","나만 아는 상대의 귀여운 점","최근에 스스로 대견했던 일","상대에게 받고 싶은 작은 보상은?","하루 중 상대가 가장 생각나는 시간은?","요즘 신경 쓰이는 일이 있어?","우리만의 별명이나 애칭 중 제일 좋은 건?","다시 가고 싶은 장소","오늘 하루를 한 단어로","상대에게 배우고 싶은 점","요즘 가장 듣고 있는 노래","주말에 하고 싶은 것","내가 더 노력하고 싶은 부분","오늘 상대에게 하고 싶은 한마디"];

let key="",role="",data={entries:[],reactions:[],goals:[],settings:{}};
let view="today",logMode="list",calMonth="",calDay="",sheet=null,ui={},jarPeek=null;
let gateWho="";const busyHeart={};
try{key=localStorage.getItem("pw2-key")||"";role=localStorage.getItem("pw2-role")||"";localStorage.removeItem("paw-key");localStorage.removeItem("paw-role");}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDay=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"});
const fmtTime=new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",hour:"numeric",minute:"2-digit"});
const kday=iso=>fmtDay.format(new Date(iso));
const today=()=>fmtDay.format(new Date());
const dayDiff=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);
const other=()=>role==="pet"?"partner":"pet";
function ago(iso){const m=Math.round((Date.now()-Date.parse(iso))/6e4);if(m<1)return"방금";if(m<60)return m+"분 전";const h=Math.round(m/60);if(h<24)return h+"시간 전";return dayLabel(kday(iso));}
function dayLabel(d){const t=today();if(d===t)return"오늘";if(dayDiff(d,t)===1)return"어제";const[y,m,dd]=d.split("-");return`${y===t.slice(0,4)?"":y+". "}${+m}월 ${+dd}일`;}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400);}
function burst(){const b=document.createElement("div");b.className="burst";document.body.appendChild(b);setTimeout(()=>b.remove(),900);}

/* ---------- api ---------- */
async function api(body){
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key})});
  if(!res.ok)throw{code:"network"}; const d=await res.json(); if(d.error)throw{code:d.error}; return d;
}
function apply(d){
  if(!d||!Array.isArray(d.entries))return;
  const by=(a,b)=>String(a.at).localeCompare(String(b.at));
  const dn=v=>/^\d{4}-\d{2}-\d{2}T/.test(v||"")?kday(v):v; // 시트가 날짜를 날짜 형식으로 바꿔 저장한 경우 되돌리기
  data={entries:d.entries.map(e=>({...e,goal_id:dn(e.goal_id)})).sort(by),reactions:(d.reactions||[]).map(r=>({...r,value:dn(r.value)})).sort(by),goals:d.goals||[],settings:d.settings||{}};
  if(d.role&&d.role!==role){role=d.role;try{localStorage.setItem("pw2-role",role);}catch(e){}}
}
function errMsg(e){const c=e&&e.code;if(c==="pin")return"비밀번호가 맞지 않아요.";if(c==="forbidden")return"이 기능은 상대만 쓸 수 있어요.";if(c==="empty")return"내용을 적어 주세요.";return"저장하지 못했어요. 연결을 확인해 주세요.";}
async function write(body,okMsg){try{const d=await api(body);apply(d);render();if(okMsg)toast(okMsg);return d;}catch(e){toast(errMsg(e));throw e;}}
function notify(to,message){
  const topic=data.settings[to==="pet"?"ntfy_pet":"ntfy_partner"]; if(!topic)return;
  try{fetch("https://ntfy.sh/",{method:"POST",body:JSON.stringify({topic,title:"Pawprints",message,tags:["paw_prints"],click:location.href.split("#")[0].split("?")[0]})}).catch(()=>{});}catch(e){}
}

/* ---------- derived ---------- */
const rx=(id,kind)=>data.reactions.filter(r=>r.entry_id===id&&(!kind||r.kind===kind));
const of=t=>data.entries.filter(e=>e.type===t);
const addDays=(d,n)=>new Date(Date.parse(d+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
const weekStart=d=>addDays(d,-((new Date(d+"T00:00:00Z").getUTCDay()+6)%7));
const isDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"");
const orderWeek=o=>isDate(o.goal_id)?weekStart(o.goal_id):weekStart(kday(o.at));
const weekOrder=w=>of("order").filter(o=>orderWeek(o)===w).pop();
const checks=o=>rx(o.id,"done").filter(r=>isDate(r.value));
const WD=["월","화","수","목","금","토","일"];
function weekRow(o,mine){const ws=orderWeek(o),t=today(),c=checks(o);
  return`<div class="week${mine?"":" ro"}" role="group" aria-label="요일별 체크">${WD.map((n,i)=>{const d=addDays(ws,i),on=c.some(r=>r.value===d),fut=d>t;
    return`<button class="wd${d===t?" now":""}${fut?" fut":""}" data-wchk="${o.id}" data-date="${d}" aria-pressed="${on}" aria-label="${n}요일 ${on?"지킴":"아직"}" ${!mine||fut?"disabled":""}><i>${on?"✓":""}</i><span>${n}</span></button>`;}).join("")}</div>`;}
const qIndex=d=>Math.floor(Date.parse(d+"T00:00:00Z")/864e5)%QUESTIONS.length;
function monthStamps(ym){
  const a=of("stamp").filter(e=>kday(e.at).slice(0,7)===ym).map(e=>({at:e.at,text:e.title}));
  const b=data.reactions.filter(r=>r.kind==="stamp"&&kday(r.at).slice(0,7)===ym).map(r=>{const e=data.entries.find(x=>x.id===r.entry_id);return{at:r.at,text:e?`「${e.title}」에 찍은 도장`:"칭찬 도장"};});
  return a.concat(b).sort((x,y)=>String(x.at).localeCompare(String(y.at)));
}
const feedTypes=["stamp","order","answer","note","practice","moment"];

/* ---------- 오늘 ---------- */
function vToday(){
  const t=today(), s=data.settings, sig=SIGNALS[s.signal];
  let h="";
  // signal
  if(role==="pet"){
    h+=`<section class="card"><div class="hd"><h2>오늘 내 컨디션</h2>${s.signal_at?`<span class="small muted">${ago(s.signal_at)}</span>`:""}</div>
      <div class="sig" role="group" aria-label="컨디션 신호등">${Object.entries(SIGNALS).map(([k,[n,d,c]])=>`<button data-sig="${k}" style="--c:${c}" aria-pressed="${s.signal===k}" aria-label="${d}"><i></i></button>`).join("")}</div>
      <p class="small muted">빨강은 언제든 눌러도 돼요. 이유를 묻지 않기로 해요.</p></section>`;
  }else{
    h+=`<section class="card${s.signal==="red"?" alert":""}"><span class="lbl">연이의 컨디션</span>${sig?`<div class="sigview" style="--c:${sig[2]}" role="img" aria-label="${sig[1]}"><i></i><p class="small muted">${ago(s.signal_at)}</p></div>`:`<p class="muted">아직 신호를 남기지 않았어요.</p>`}</section>`;
  }
  const hSig=h;h="";
  // weekly order
  const ws=weekStart(t), wo=weekOrder(ws);
  if(wo){const n=checks(wo).length;
    h+=`<section class="card order"><div class="hd"><span class="from">이번 주의 지시 · ${+ws.slice(5,7)}월 ${+ws.slice(8)}일 주</span><span class="wcount">${n} / 7일</span></div>`;
    if(role==="partner"&&ui.orderEdit)h+=`<form class="inl" id="orderForm" style="flex-direction:column"><textarea class="field" maxlength="120" aria-label="이번 주의 지시">${esc(wo.title)}</textarea><div class="row"><button type="button" class="ghost" id="orderCancel">취소</button><button class="btn" style="flex:1">고치기</button></div></form>`;
    else h+=`<p class="txt">${esc(wo.title)}</p>`;
    h+=weekRow(wo,role==="pet");
    h+=role==="pet"?`<p class="small" style="color:var(--sage-ink)">지킨 날을 눌러 체크해요. 지난 요일도 체크할 수 있어요.</p>`
      :ui.orderEdit?"":`<div class="row"><button class="link" id="orderEditOpen">고치기</button><button class="link" style="color:var(--muted)" data-cancel="${wo.id}">거두기</button></div>`;
    h+=`</section>`;
  }else if(role==="partner"){
    const prev=weekOrder(addDays(ws,-7));
    h+=ui.orderForm?`<section class="card"><h2>이번 주의 지시</h2><form class="inl" id="orderForm" style="flex-direction:column"><textarea class="field" maxlength="120" placeholder="예: 매일 12시 전에 자기" aria-label="이번 주의 지시"></textarea>
        <div class="row"><button type="button" class="ghost" id="orderCancel">취소</button><button class="btn" style="flex:1">정하기</button></div></form></section>`
      :`<section class="card"><div class="hd"><span class="small muted">이번 주 지시는 없어요. 정하고 싶을 때만 정해요.</span></div><div class="row"><button class="btn soft" id="orderOpen">정하기</button>${prev?`<button class="ghost" id="orderCarry">지난주 지시 이어가기</button>`:""}</div></section>`;
  }
  const hOrd=h;h="";
  // question
  const qi=qIndex(t), ans=of("answer").filter(a=>a.goal_id===t), mine=ans.find(a=>a.author===role), theirs=ans.find(a=>a.author!==role);
  h+=`<section class="card"><span class="lbl">오늘의 질문</span><p class="q">${esc(QUESTIONS[qi])}</p>
    ${theirs?`<div class="ans"><span class="who">${NAME[theirs.author]}</span><p>${esc(theirs.title)}</p></div>`:""}
    ${mine?`<div class="ans"><span class="who">나</span><p>${esc(mine.title)}</p></div>`:`<form class="inl" id="ansForm"><input class="field" maxlength="300" placeholder="내 답" aria-label="내 답"><button class="ghost">답하기</button></form>`}</section>`;
  const hQ=h;h="";
  // jar
  const ym=t.slice(0,7), st=monthStamps(ym), [yy,mm,dd]=t.split("-");
  let slots=""; for(let i=0;i<Math.min(PER,st.length);i++){const x=XS[i%5]/JW*100,y=YS[Math.floor(i/5)]/JH*100,rot=((i*37)%21)-10;slots+=`<button class="slot on" style="left:${x}%;top:${y}%" data-jar="${i}" aria-label="${i+1}번 도장"><span class="seal" style="transform:rotate(${rot}deg)"></span></button>`;}
  const rw=s.reward||"";
  h+=`<section style="display:flex;flex-direction:column;gap:8px"><div class="jarcap"><b>${+mm}월의 병</b><span class="small muted">칭찬 도장 ${Math.min(st.length,PER)} / ${PER}</span></div>
    <div class="board">${slots}<div class="plaque">${yy}. ${mm}. ${dd}</div></div>

/* ---------- 기록 ---------- */
function entryCard(e){
  const t=feedTypes.includes(e.type)?e.type:"note", hearts=rx(e.id,"heart"), cm=rx(e.id,"comment"), stamps=rx(e.id,"stamp"), done=rx(e.id,"done")[0];
  const myHeart=hearts.find(r=>r.author===role), u=ui[e.id]||{};
  let label=TYPE[t]||"한 줄", body=`<p class="txt">${esc(e.title)}</p>`, sub="";
  if(t==="answer"){const q=e.note||QUESTIONS[qIndex(e.goal_id)]||"";body=`<p class="sub" style="font-weight:600">Q. ${esc(q)}</p>`+body;}
  if(t==="order"){const w=orderWeek(e),c=checks(e);label="이번 주의 지시";sub=`<p class="sub">${+w.slice(5,7)}월 ${+w.slice(8)}일 주 · ${c.length} / 7일 지킴</p>${weekRow(e,false)}`;}
  if(e.note&&t!=="answer")sub+=`<p class="sub">${esc(e.note)}</p>`;
  const hr=e.author==="pet"?"partner":"pet", hOn=hearts.some(r=>r.author===hr);
  let acts=(role===hr?`<button class="act h-${hr}" data-heart="${e.id}" aria-pressed="${hOn}" aria-label="하트">♥</button>`:hOn?`<span class="act h-${hr}" aria-pressed="true" aria-label="${NAME[hr]}의 하트">♥ <small>${NAME[hr]}</small></span>`:"")+`<button class="act" data-cmt="${e.id}">댓글</button>`;
  if(role==="partner"&&e.author==="pet"&&t!=="order"&&t!=="answer"){const did=stamps.some(r=>r.author==="partner");acts+=`<button class="act" data-stamp="${e.id}" ${did?"disabled":""}><span class="mini-seal" style="width:14px;height:14px;vertical-align:-2px"></span> ${did?"찍음":"도장"}</button>`;}
  if(e.author===role&&t!=="order")acts+=u.del?`<span class="small" style="margin-left:auto">지울까요? <button class="danger" data-delyes="${e.id}">지우기</button> <button class="link" data-delno="${e.id}">아니요</button></span>`:`<button class="link" style="margin-left:auto;color:var(--muted)" data-del="${e.id}">지우기</button>`;
  return`<article class="ent"><div class="hd"><span class="tag ${t}">${label}</span><span>${t==="order"?"파트너":NAME[e.author]} · ${fmtTime.format(new Date(e.at))}</span>${stamps.length?`<span class="mini-seal" title="칭찬 도장"></span>`:""}</div>
    ${body}${sub}
    ${cm.length?`<div class="cmts">${cm.map(c=>`<p><b>${NAME[c.author]}</b>${esc(c.value)}</p>`).join("")}</div>`:""}

}
function feedHtml(es){let last="",h=`<div class="feed">`;es.forEach(e=>{const d=kday(e.at);if(d!==last){h+=`<div class="dayhead">${dayLabel(d)}</div>`;last=d;}h+=entryCard(e);});return h+`</div>`;}
function vLog(){
  const all=data.entries.filter(e=>feedTypes.includes(e.type)).slice().reverse();
  let h=`<div class="row" style="justify-content:space-between"><h2>기록</h2><div class="seg" role="tablist"><button role="tab" data-mode="list" aria-selected="${logMode==="list"}">목록</button><button role="tab" data-mode="cal" aria-selected="${logMode==="cal"}">달력</button></div></div>`;
  if(logMode==="list")return h+(all.length?feedHtml(all):`<p class="empty">아직 기록이 없어요. 아래 버튼으로 첫 줄을 남겨 보세요.</p>`);
  const t=today(); if(!calMonth)calMonth=t.slice(0,7);
  const [y,m]=calMonth.split("-").map(Number), days=new Date(Date.UTC(y,m,0)).getUTCDate(), lead=new Date(Date.UTC(y,m-1,1)).getUTCDay();
  const by={}; all.forEach(e=>{const d=kday(e.at);(by[d]=by[d]||[]).push(e);});
  let cells=["일","월","화","수","목","금","토"].map(d=>`<div class="dow">${d}</div>`).join("")+"<div></div>".repeat(lead);
  for(let d=1;d<=days;d++){const ds=`${calMonth}-${String(d).padStart(2,"0")}`,es=by[ds]||[];cells+=`<button class="day${es.length?" has":""}${ds===t?" today":""}" data-day="${ds}" aria-pressed="${ds===calDay}" aria-label="${m}월 ${d}일 기록 ${es.length}개"><span class="n">${d}</span><span class="pp">${es.slice(0,4).map(e=>`<i class="${e.type}"></i>`).join("")}</span></button>`;}
  h+=`<section class="card"><div class="calhead"><button id="calPrev" aria-label="이전 달">‹</button><h3>${y}년 ${m}월</h3><button id="calNext" aria-label="다음 달">›</button></div><div class="cal">${cells}</div></section>`;
  if(calDay)h+=by[calDay]?feedHtml(by[calDay]):`<p class="empty">${dayLabel(calDay)}은 조용히 지나갔어요.</p>`;

  if(d.delno){ui[d.delno]={};render();return;}
  if(d.delyes){await write({action:"removeEntry",id:d.delyes},"지웠어요");return;}
  if(d.okrule){await write({action:"star",id:d.okrule,on:true},"약속을 승인했어요");notify("pet","제안한 약속이 승인됐어요");return;}
  if(d.rmrule){await write({action:"removeEntry",id:d.rmrule},"뺐어요");return;}
  if(d.wish){const done=rx(d.wish,"done")[0];if(done)await write({action:"removeReaction",id:done.id});else await write({action:"react",reaction:{entry_id:d.wish,kind:"done",value:""}},"함께 해냈어요");return;}
  if(d.rmwish){await write({action:"removeEntry",id:d.rmwish},"뺐어요");return;}
  if(b.id==="setToggle"){ui.settings=!ui.settings;render();return;}
  if(b.id==="copyTopic"){try{await navigator.clipboard.writeText($("topic").textContent);toast("복사했어요");}catch(x){toast("길게 눌러 복사해 주세요");}return;}
  if(b.id==="logout"||b.id==="switchMe"){if(b.id==="switchMe"&&!b.dataset.armed){b.dataset.armed=1;b.textContent="나갈까요?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=NAME[role]+" ⇄";}},2500);return;}
    key="";role="";gateWho="";try{localStorage.removeItem("pw2-key");localStorage.removeItem("pw2-role");}catch(x){}data={entries:[],reactions:[],goals:[],settings:{}};render();return;}
  }catch(x){}
});
async function refresh(){
  if(!key)return;
  try{apply(await api({action:"read"}));const busy=sheet||(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName));if(!busy)render();}
  catch(e){if(e&&e.code==="pin"){key="";role="";try{localStorage.removeItem("pw2-key");}catch(x){}render();toast("비밀번호가 바뀌었어요. 다시 들어와 주세요.");}}
}
route(); if(key)refresh();
setInterval(()=>{if(document.visibilityState==="visible")refresh();},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh();});
</script>
