<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="자소서 초안이 없는 취준생이 질문에 답하며 상담용 첫 초안을 완성하는 워크북">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>자소서 첫걸음 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one step at a time — compact sticky header (title, progress, short step tabs), single column of answer cards, optional questions folded, sticky prev/next bar that hides while the keyboard is open. Highlighter yellow marks what matters. */
:root{
  --paper:#F6F7FA; --card:#FFFFFF; --ink:#1E2740; --ink-2:#4A5574; --muted:#6F7993;
  --line:#E2E6EF; --hi:#FFD84D; --hi-soft:#FFF4C2; --accent:#3557D6; --accent-soft:#E8EDFD;
  --ok:#1F8A66; --ok-soft:#E1F5EE; --warn:#B4640F; --warn-soft:#FDF0E1;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px; --hh:132px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151F; --card:#1B2030; --ink:#EEF1F8; --ink-2:#B9C1D6; --muted:#949CB2;
  --line:#2C3346; --hi:#F2C93A; --hi-soft:#3A3318; --accent:#8AA3FF; --accent-soft:#232C4A;
  --ok:#4CC79B; --ok-soft:#173A2F; --warn:#F0A65A; --warn-soft:#3A2A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151F; --card:#1B2030; --ink:#EEF1F8; --ink-2:#B9C1D6; --muted:#949CB2;
  --line:#2C3346; --hi:#F2C93A; --hi-soft:#3A3318; --accent:#8AA3FF; --accent-soft:#232C4A;
  --ok:#4CC79B; --ok-soft:#173A2F; --warn:#F0A65A; --warn-soft:#3A2A17; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh) + 12px);scroll-padding-bottom:110px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 8px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0;white-space:nowrap}
.brand h1 mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 2px}
.saved{font-size:.76rem;color:var(--muted);white-space:nowrap}
.saved b{color:var(--ok);font-weight:600}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.rail{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font:500 .84rem var(--f-body);padding:0 12px;border-radius:99px;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.76rem}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.on .n{color:var(--hi)}
.chip.done:not(.on){border-color:var(--ok);color:var(--ok)}

main .wrap{padding-block:20px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
body.kb main .wrap{padding-bottom:40vh}
.step-head{display:flex;flex-direction:column;gap:6px;scroll-margin-top:calc(var(--hh) + 12px)}
.step-head:focus{outline:none}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.step-head h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.3;margin:0;text-wrap:balance}
.step-head p{margin:0;color:var(--ink-2)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.meta span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q-top{display:flex;gap:10px;align-items:flex-start}
.qn{flex:0 0 auto;font:600 .75rem var(--f-body);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qn.star{background:var(--hi-soft);color:var(--ink)}
.q{font-weight:600;font-size:1.02rem;margin:0;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.tag.core{color:var(--accent)}
.tag.private{color:var(--warn)}
.hint{font-size:.88rem;color:var(--muted);margin:0}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,background .15s}
textarea{min-height:88px;resize:vertical;line-height:1.6}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);background:var(--card)}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.85}
.count{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.count .good{color:var(--ok);font-weight:600}
.count .low{color:var(--warn)}
.ex{font-size:.88rem;background:var(--hi-soft);border-radius:10px;padding:10px 12px;color:var(--ink-2)}
.ex b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.field label{display:block;font-size:.84rem;font-weight:600;margin-bottom:4px;color:var(--ink-2)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:inline-flex;align-items:center;min-height:40px;border:1.5px solid var(--line);border-radius:99px;padding:0 14px;font-size:.92rem;background:var(--paper)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:10px;cursor:pointer;min-height:44px}
.checks label:hover{background:var(--paper)}
.checks input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto;margin-top:3px}
.checks input:checked+span{color:var(--muted)}

.tip{border-left:4px solid var(--hi);background:var(--card);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;font-size:.92rem;color:var(--ink-2);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tip strong{color:var(--ink);display:block;margin-bottom:2px;font-size:.84rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.tbl table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:440px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:600;background:var(--paper)}
.tbl tr:last-child td{border-bottom:0}

.preview{background:var(--accent-soft);border-radius:10px;padding:14px;font-size:.95rem;line-height:1.75;word-break:break-word}
.preview .ph{background:var(--hi-soft);border:1px dashed var(--warn);color:var(--warn);border-radius:6px;padding:0 5px;font-size:.85rem}
.preview .fill{background:linear-gradient(transparent 60%,var(--hi) 60%);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 .92rem var(--f-body);min-height:44px;border-radius:10px;padding:0 16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.86rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.btn.big{width:100%;min-height:52px;font-size:1rem}
.btn:focus-visible,.chip:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:default}

details.more{background:transparent;border:1.5px dashed var(--line);border-radius:var(--r)}
details.more>summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:48px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary span{font-weight:400;font-size:.8rem;color:var(--muted)}
details.more>summary::after{content:"펼치기";font-size:.8rem;color:var(--accent);font-weight:600;white-space:nowrap}
details.more[open]>summary::after{content:"접기"}
.more-body{display:flex;flex-direction:column;gap:12px;padding:0 10px 12px}
details.mat-box summary{cursor:pointer;font-weight:600;font-size:.9rem;min-height:40px;display:flex;align-items:center}
.mats{display:flex;flex-direction:column;gap:6px;font-size:.88rem;margin-top:6px}
.mat{display:flex;gap:8px;padding:8px 10px;border-radius:8px;background:var(--paper)}
.mat .k{flex:0 0 5.5em;font-weight:600;color:var(--accent)}
.mat .v{min-width:0;white-space:pre-wrap;word-break:break-word}
.mat .v.empty{color:var(--muted)}

.start{border:2px solid var(--accent);background:var(--card)}
.start ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.start li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--paper)}
.start li .lbl{display:flex;gap:8px;align-items:center;min-width:0}
.dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--card)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative;flex:1 1 140px}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600;background:var(--paper)}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.flags{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.flags li{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:10px;background:var(--warn-soft);font-size:.88rem}
.flags .f-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:600;color:var(--ink)}
.flags .f-sn{color:var(--ink-2);word-break:break-word}
.flags .f-msg{color:var(--warn)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:8px;font-size:.86rem}
.legend div{background:var(--paper);border-radius:10px;padding:9px 11px}
.legend b{display:block;color:var(--ink)}
.ok-note{font-size:.88rem;color:var(--ok);font-weight:600}

.export{border:2px solid var(--ok);background:var(--card)}
.export textarea{font-size:14px;min-height:140px;background:var(--paper)}
.step-end{display:flex;justify-content:flex-end}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem;background:var(--warn-soft);border-radius:10px;padding:8px 10px}

nav.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.foot .wrap{padding-block:10px;display:flex;gap:10px;align-items:center}
nav.foot .btn{flex:1;min-height:48px}
nav.foot .btn.primary{flex:2}
body.kb nav.foot{display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.footer-note{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
.footer-note a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="hdr">
  <div class="wrap">
    <div class="brand">
      <h1>자소서 <mark>첫걸음</mark> 노트</h1>
      <span class="saved">답 <b id="ansCount">0</b>개 · 자동 저장</span>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="rail" id="rail" role="tablist" aria-label="단계 이동"></div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<nav class="foot" id="foot"><div class="wrap">
  <button class="btn" id="prev" type="button">이전</button>
  <button class="btn primary" id="next" type="button">다음</button>
</div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- 질문 데이터 ----------
   lvl:"opt" = 선택 질문(접힌 영역), core:true = 5분 시작 질문, private:true = 초안·복사에 들어가지 않는 개인 메모 */
const STEPS=[
{id:"s0",chip:"마음",title:"오늘은 찾아보는 날",time:"10분",
 intro:"지금까지의 결과를 평가하는 단계가 아닙니다. 오늘은 내가 실제로 해 본 일과 앞으로 해 보고 싶은 일을 하나씩 찾아볼 거예요. 떠오르지 않는 질문은 건너뛰어도 됩니다.",
 blocks:[
  {type:"start"},
  {tip:"답은 메모처럼 짧게",text:"단어나 말투 그대로 적어도 돼요. 쓰는 즉시 이 기기의 브라우저에 저장됩니다. 말하고 싶지 않은 내용은 적지 않아도 괜찮아요."},
  {q:"q1",n:"Q1",text:"지금 취업 준비에서 가장 막막한 것 한 가지는?",private:true,ph:"예: 어떤 경험을 써야 할지 모르겠다"},
  {q:"q2",n:"Q2",text:"최근에 \"이건 내가 직접 해 봤다\"고 말할 수 있는 일 한 가지는?",hint:"상담 신청, 졸업, 자격증 공부 시작처럼 작은 일도 괜찮아요.",ph:"예: 대학일자리플러스센터에 상담을 신청했다"},
  {q:"q5",n:"Q3",core:true,type:"opts",text:"관심 있는 직무를 골라 주세요 (여러 개 가능)",opts:["사무·행정","경영지원·총무","회계·경리","영업관리·고객관리","생산·품질관리","공공기관 사무","아직 모르겠음"],etc:"q5etc"},
  {q:"q6",n:"Q4",input:true,text:"준비 중이거나 준비하려는 자격증은?",hint:"준비 중인지, 이미 취득했는지 구분해서 적어 주세요.",ph:"예: 컴활 2급 필기 준비 중"},
  {q:"q7",n:"Q5",text:"그 공부로 할 수 있게 된 일, 또는 할 수 있게 될 일은?",ph:"예: 엑셀 함수로 자료를 정리하는 연습을 하고 있다",ex:"<b>스펙</b>은 \"컴활 공부 중\", <b>역량</b>은 \"엑셀로 자료를 정리할 수 있다\"예요. 아직 공부 중이라면 '할 수 있게 될 일'로 적고, 초안에서도 계획으로 씁니다."},
  {q:"q3",n:"Q6",lvl:"opt",text:"앞으로 일하면서 해 보고 싶은 일이나 지키고 싶은 태도는?",ph:"예: 맡은 서류는 마감 전에 한 번 더 확인하는 사람"},
  {q:"q4",n:"Q7",lvl:"opt",input:true,text:"전공과 졸업 시기는?",ph:"예: 경영학과, 2026년 2월 졸업"}
 ]},
{id:"s1",chip:"경험",title:"내가 실제로 해 본 일 꺼내기",time:"15분",
 intro:"작은 일도 경험이에요. 칸마다 한 줄이면 충분하고, 기억나는 숫자가 있으면 붙여 주세요. 숫자가 없으면 비워 둬도 됩니다.",
 blocks:[
  {type:"bank",n:"경험 창고",text:"분야별로 해 본 일을 적어 보세요 (빈칸 가능)",rows:[
    ["b_job","아르바이트","예: 카페 8개월, 주문·계산 담당"],
    ["b_class","수업·조별과제","예: 4명 조에서 자료 정리 담당"],
    ["b_club","동아리·학생회·봉사","예: 봉사 동아리 1년"],
    ["b_cert","자격증·독학 공부","예: 컴활 필기 독학 6주째 (준비 중)"],
    ["b_prep","취업 준비 활동","예: 취업 상담 3회 참여"],
    ["b_home","집안일·가족 돌봄","예: 동생 등하교 2년 담당"],
    ["b_hobby","취미·꾸준히 한 것","예: 가계부 1년째 작성"]]},

/* ---------- 사실 확인 ---------- */
const RULES=[
  {re:/(취득|합격(했|하였|해)|수상|자격증을\s*(땄|보유))/,cat:"확인 필요",msg:"실제로 받은 결과인가요? 준비 중이면 '준비 중'으로 고쳐 주세요."},
  {re:/\d+(\.\d+)?\s*(%|퍼센트|배)/,cat:"확인 필요",msg:"직접 계산하거나 확인한 비율인가요? 모르면 숫자를 빼거나 [추가 확인 필요]로 남겨 주세요."},
  {re:/(최고|완벽|누구보다|반드시|절대|항상)/,cat:"확인 필요",msg:"근거 없이 강하게 말하는 표현일 수 있어요."},
  {re:/(하겠습니다|할 계획|예정입니다|할 것입니다)/,cat:"계획",only:["d2"],msg:"경험 항목에 계획 문장이 있어요. 실제로 한 일과 구분해 주세요."},
  {re:/\[(추가 확인 필요|회사 맞춤 수정)[^\]]*\]/,cat:"빈칸",msg:"아직 채우지 않은 부분이에요. 상담 때 함께 채워도 됩니다."}
];
function scanFacts(){
  const out=[];
  ["d1","d2","d3","d4"].forEach(k=>{
    const txt=val(k);if(!txt)return;
    txt.split(/\n+|(?<=[.!?])\s+/).forEach(sn=>{
      const s=sn.trim();if(!s)return;
      for(const r of RULES){if(r.only&&!r.only.includes(k))continue;if(r.re.test(s)){out.push({k,s,r});break}}
    });
  });
  return out;
}
function factsHTML(){
  const anyDraft=["d1","d2","d3","d4"].some(k=>val(k));
  if(!anyDraft)return `<p class="hint">초안을 쓰면 여기에서 확인할 문장을 자동으로 찾아 보여드려요.</p>`;
  const f=scanFacts();
  if(!f.length)return `<p class="ok-note">자동으로 찾은 확인 문장은 없어요. 그래도 아래 세 가지를 직접 한 번 확인해 주세요.</p>`;
  return `<ul class="flags">${f.map(x=>`<li><span class="f-top"><span class="tag ${x.r.cat==="계획"?"core":"private"}">${x.r.cat}</span>${DRAFT_NAMES[x.k]}</span><span class="f-sn">${esc(x.s.length>80?x.s.slice(0,80)+"…":x.s)}</span><span class="f-msg">${x.r.msg}</span></li>`).join("")}</ul>`;
}

function counter(k,min,max){

  const cls=len>=min&&len<=max?"good":(len>0&&len<min*0.9?"low":"");
  return `<div class="count"><span>참고 분량 ${min}–${max}자 · 회사 기준이 있으면 그에 맞추기</span><span class="${cls}" data-cnt="${k}" data-min="${min}" data-max="${max}">${len}자</span></div>`;
}

    const mats=b.from.map(k=>`<div class="mat"><span class="k">${LABEL[k]||k}</span><span class="v ${mval(k)?"":"empty"}">${mval(k)?esc(mval(k)):"비어 있음"}</span></div>`).join("");
    return `<div class="card" id="card-${b.key}"><div class="q-top"><span class="qn star">초안</span><p class="q">${b.title}</p></div><p class="hint"><b>${b.order}</b><br>${b.guide}</p><details class="mat-box" ${val(b.key)?"":"open"}><summary>앞에서 쓴 내 재료 보기</summary><div class="mats">${mats}</div></details><div class="row"><button class="btn sm primary" type="button" data-skel="${b.key}">내 답으로 뼈대 넣기</button><button class="btn sm" type="button" data-mark="${b.key}">[추가 확인 필요] 넣기</button></div><div class="confirm" id="skc-${b.key}" hidden><span>이미 쓴 글이 있어요. 뼈대를 아래에 덧붙일까요?</span><button class="btn sm" type="button" data-skelyes="${b.key}">덧붙이기</button><button class="btn sm" type="button" data-skelno="${b.key}">취소</button></div><textarea id="${b.key}" data-k="${b.key}" rows="9" placeholder="'내 답으로 뼈대 넣기'를 누르거나, 재료를 보며 직접 써 보세요. 뼈대는 내가 쓴 답만 이어 붙이고, 빈 곳은 [추가 확인 필요]로 남겨요.">${esc(S[b.key])}</textarea>${counter(b.key,b.min,b.max)}</div>`}
  case "facts":return `<div class="card"><p class="q">사실 확인</p><p class="hint">초안의 문장이 어디에 속하는지 구분해 주세요.</p><div class="legend"><div><b>실제로 한 일</b>했던 행동과 확인된 결과</div><div><b>앞으로 할 계획</b>"준비 중", "익히겠습니다"처럼 미래형으로</div><div><b>확인이 필요한 내용</b>숫자, 취득·합격 여부는 [추가 확인 필요]로</div></div><div id="factBox">${factsHTML()}</div><ul class="checks">${["자격증은 '준비 중'과 '취득'을 정확히 구분했다","'지원했다'와 '합격했다', '노력했다'와 '성과가 났다'를 섞지 않았다","확인하지 못한 숫자나 결과는 [추가 확인 필요]로 남겼다"].map((it,i)=>{const k=`chk_fact_${i}`;return `<li><label><input type="checkbox" id="${k}" data-chk="${k}" ${S[k]?"checked":""}><span>${it}</span></label></li>`}).join("")}</ul></div>`;
  case "postcheck":{
    if(S.post==="yes")return `<div class="card" id="postBox"><p class="q">채용공고 맞춤 점검</p><ul class="checks">${["공고의 주요 업무(Q12)가 지원동기에 들어갔다","공고의 요구 역량(Q13)과 연결되는 실제 행동이 있다","공고의 실제 문항 이름과 글자 수에 맞게 순서와 분량을 고쳤다","회사 이름을 정확히 썼다"].map((it,i)=>{const k=`chk_post_${i}`;return `<li><label><input type="checkbox" id="${k}" data-chk="${k}" ${S[k]?"checked":""}><span>${it}</span></label></li>`}).join("")}</ul><p class="hint">공고에 다른 문항이 있다면 이미 쓴 답에서 소재를 가져오세요.</p><div class="tbl"><table><thead><tr><th>추가 문항</th><th>가져올 답</th></tr></thead><tbody><tr><td>성장 과정</td><td>Q2 직접 해 본 일, STEP 1 경험 창고</td></tr><tr><td>협업</td><td>Q9 함께한 일에서 내가 한 말·행동</td></tr><tr><td>갈등·의견 차이</td><td>Q9 중 의견이 달랐던 부분 (없으면 쓰지 않기)</td></tr><tr><td>도전</td><td>Q8 스스로 찾아서 해 본 일</td></tr><tr><td>문제 해결</td><td>STEP 3 행동·결과, Q10 실수 뒤 바꾼 행동</td></tr></tbody></table></div></div>`;
    if(S.post==="no")return `<div class="tip" id="postBox"><strong>공통 초안으로 충분해요</strong>회사 정보는 지금 넣지 않아도 됩니다. 지원할 곳이 생기면 [회사 맞춤 수정] 표시가 있는 곳과 지원동기를 공고에 맞게 고치세요.</div>`;
    return `<div id="postBox" hidden></div>`}
  case "export":return `<div class="card export" id="card-export"><p class="q">초안 복사·저장하기</p><p class="hint">여기까지 적은 내용은 첫 초안입니다. 복사하거나 저장해서 상담사에게 보여주고, 함께 고칠 부분을 확인해 보세요.</p><button class="btn primary big" type="button" id="copyDraft">초안 4개 복사하기</button><label class="hint" for="exportBox">복사할 내용 미리보기 (복사가 안 되면 칸을 길게 눌러 전체 선택하세요)</label><textarea id="exportBox" readonly rows="8">${esc(draftText())}</textarea><div class="row"><button class="btn sm" type="button" id="selectAll">미리보기 전체 선택</button><button class="btn sm" type="button" id="copyAll">모든 답 복사 (개인 메모 제외)</button></div><p class="hint">이 화면에서는 파일 다운로드가 지원되지 않아요. 복사한 뒤 메모 앱, 메일, 메신저의 나에게 보내기에 붙여 넣어 저장하세요. 답은 지금 쓰는 기기의 이 브라우저에만 저장되어 다른 기기에서는 보이지 않아요.${storageOK?"":" <b>지금 브라우저에서는 자동 저장이 막혀 있어요. 페이지를 닫기 전에 꼭 복사해 두세요.</b>"}</p><div class="row"><button class="btn ghost sm" type="button" id="toStart">처음 단계로 (답은 그대로 남아요)</button><button class="btn ghost sm" type="button" id="resetBtn">모든 답 지우기</button></div><div class="confirm" id="confirmBox" hidden><span>모든 답을 지울까요? 되돌릴 수 없어요.</span><button class="btn sm" type="button" id="resetYes">지우기</button><button class="btn sm" type="button" id="resetNo">취소</button></div></div><p class="footer-note">참고: <a href="https://community.linkareer.com/employment_data/3896386" target="_blank" rel="noopener">링커리어 자기소개서 가이드</a> · <a href="https://daglo.ai/d/ko/blog/how-to-write-cover-letter-with-ai-for-job-seekers" target="_blank" rel="noopener">다글로 AI 자소서 가이드</a></p>`;
  }
  return "";
}
function render(){
  const st=STEPS[cur];
  const req=allQ(st).filter(b=>b.lvl!=="opt").length;
  let h=`<div class="step-head" id="stepHead" tabindex="-1"><span class="eyebrow">STEP ${cur} / ${STEPS.length-1}</span><h2>${st.title}</h2><p>${st.intro}</p><div class="meta"><span>약 ${st.time}</span>${req?`<span>기본 질문 ${req}개</span>`:""}<span>빈칸이어도 다음으로 갈 수 있어요</span></div></div>`;
  const opts=st.blocks.filter(b=>b.lvl==="opt");
  let optDone=false;
  st.blocks.forEach(b=>{
    if(b.lvl==="opt"){
      if(optDone)return;optDone=true;
      const filled=opts.some(o=>val(o.q));
      h+=`<details class="more" id="more-${st.id}" ${filled?"open":""}><summary><div>선택 질문 ${opts.length}개 더 보기<br><span>여유가 있을 때만 쓰세요. 건너뛰어도 됩니다.</span></div></summary><div class="more-body">${opts.map(qCard).join("")}</div></details>`;
      return;
    }
    h+=blockHTML(b);
  });
  if(cur<STEPS.length-1)h+=`<div class="step-end"><button class="btn primary" type="button" data-jump="${cur+1}">다음: STEP ${cur+1} ${STEPS[cur+1].chip} →</button></div>`;
  document.getElementById("view").innerHTML=h;
  const prev=document.getElementById("prev"),next=document.getElementById("next");
  prev.disabled=cur===0;
  next.textContent=cur===STEPS.length-1?"초안 복사하기":`다음: ${STEPS[cur+1].chip}`;
  renderRail();updateMeta();
}
function renderRail(){
  const rail=document.getElementById("rail");
  rail.innerHTML=STEPS.map((s,i)=>`<button class="chip${i===cur?" on":""}" type="button" role="tab" aria-selected="${i===cur}" aria-label="STEP ${i} ${s.chip}" data-jump="${i}"><span class="n">${i}</span>${s.chip}</button>`).join("");
  const on=rail.querySelector(".chip.on");
  if(on){const target=on.offsetLeft-(rail.clientWidth-on.offsetWidth)/2;rail.scrollLeft=Math.max(0,target)}
}
function setHH(){const h=document.getElementById("hdr").offsetHeight;document.documentElement.style.setProperty("--hh",h+"px")}
function go(i,focusKey){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  try{history.replaceState(null,"","#"+STEPS[cur].id)}catch(e){}
  render();setHH();
  if(focusKey){
    let el=document.getElementById(focusKey)||document.getElementById(focusKey+"_0");
    if(el){const d=el.closest("details");if(d)d.open=true;const card=el.closest(".card")||el;card.scrollIntoView({block:"start"});try{el.focus({preventScroll:true})}catch(e){}return}
  }
  window.scrollTo(0,0);
  try{document.getElementById("stepHead").focus({preventScroll:true})}catch(e){}
}

/* ---------- 입력 처리 ---------- */
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function copy(text,msg){
  const done=()=>toast(msg||"복사했어요");
  const fail=()=>fallback(text,done);
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fail);return}}catch(e){}
  fail();
}
function fallback(text,done){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();
  if(ok)return done();
  const box=document.getElementById("exportBox");
  if(box){box.value=text;box.focus();box.select();toast("자동 복사가 막혀 있어요. 선택된 내용을 길게 눌러 복사해 주세요")}
  else toast("자동 복사가 막혀 있어요. 마지막 단계의 미리보기 칸에서 직접 복사해 주세요");
}
function refreshLive(changedKey){
  document.querySelectorAll("[data-tpl]").forEach(p=>p.innerHTML=fillTpl(p.dataset.tpl));
  const po=document.getElementById("promptOut");if(po)po.textContent=buildPrompt();
  const fb=document.getElementById("factBox");if(fb&&/^d[1-4]$/.test(changedKey))fb.innerHTML=factsHTML();
  const ex=document.getElementById("exportBox");if(ex)ex.value=draftText();
}
const lastCaret={};
document.addEventListener("input",e=>{
  const t=e.target;if(!t.dataset.k)return;
  S[t.dataset.k]=t.value;save();
  const len=t.value.trim().length;
  const c=document.querySelector(`[data-cnt="${t.dataset.k}"]`);
  if(c){const min=+c.dataset.min,max=+c.dataset.max;c.textContent=len+"자";c.className=len>=min&&len<=max?"good":(len>0&&len<min*0.9?"low":"")}
  const l=document.querySelector(`[data-len="${t.dataset.k}"]`);if(l)l.textContent=len+"자";
  refreshLive(t.dataset.k);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.multi){S[t.dataset.multi]=[...document.querySelectorAll(`[data-multi="${t.dataset.multi}"]:checked`)].map(x=>x.value);save();refreshLive()}
  if(t.dataset.chk){S[t.dataset.chk]=t.checked;save()}
  if(t.dataset.post){S.post=t.dataset.post;save();const y=window.scrollY;render();window.scrollTo(0,y)}
});
document.addEventListener("focusout",e=>{const t=e.target;if(/^d[1-4]$/.test(t.id))lastCaret[t.id]=[t.selectionStart,t.selectionEnd]});
function insertSkel(key,append){
  const ta=document.getElementById(key);const sk=skeleton(key);
  ta.value=append&&ta.value.trim()?ta.value.replace(/\s+$/,"")+"\n\n"+sk:sk;
  S[key]=ta.value;save();ta.dispatchEvent(new Event("input",{bubbles:true}));
  toast("내가 쓴 답으로 뼈대를 넣었어요. 문장을 이어 다듬어 주세요");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.jump!==undefined)return go(+t.dataset.jump,t.dataset.focus);
  if(t.id==="prev")return go(cur-1);
  if(t.id==="next"){if(cur===STEPS.length-1)return copy(draftText(),"초안 4개를 복사했어요");return go(cur+1)}
  if(t.dataset.copytpl)return copy(plainTpl(t.dataset.copytpl),"문장을 복사했어요");
  if(t.dataset.skel){const k=t.dataset.skel;if(val(k)){document.getElementById("skc-"+k).hidden=false;return}return insertSkel(k,false)}
  if(t.dataset.skelyes){document.getElementById("skc-"+t.dataset.skelyes).hidden=true;return insertSkel(t.dataset.skelyes,true)}
  if(t.dataset.skelno){document.getElementById("skc-"+t.dataset.skelno).hidden=true;return}
  if(t.dataset.mark){const k=t.dataset.mark,ta=document.getElementById(k),mk="[추가 확인 필요]";const [s,en]=lastCaret[k]||[ta.value.length,ta.value.length];ta.value=ta.value.slice(0,s)+mk+ta.value.slice(en);S[k]=ta.value;save();ta.dispatchEvent(new Event("input",{bubbles:true}));ta.focus();const p=s+mk.length;try{ta.setSelectionRange(p,p)}catch(err){}lastCaret[k]=[p,p];return}
  if(t.id==="copyPrompt")return copy(buildPrompt(),"요청문을 복사했어요");
  if(t.id==="copyDraft")return copy(draftText(),"초안 4개를 복사했어요");
  if(t.id==="copyAll")return copy(allText(),"모든 답을 복사했어요 (개인 메모 제외)");
  if(t.id==="selectAll"){const b=document.getElementById("exportBox");b.focus();b.select();try{b.setSelectionRange(0,b.value.length)}catch(err){}return}
  if(t.id==="toStart")return go(0);
  if(t.id==="resetBtn"){document.getElementById("confirmBox").hidden=false;return}
  if(t.id==="resetNo"){document.getElementById("confirmBox").hidden=true;return}
  if(t.id==="resetYes"){S={_v:2};save();go(0);toast("모든 답을 지웠어요");return}
});

/* 키보드가 열려 있을 때 하단 버튼 숨기기 (터치 기기) */
const touch=window.matchMedia&&window.matchMedia("(pointer:coarse)").matches;
let kbTimer;
document.addEventListener("focusin",e=>{if(touch&&e.target.matches("textarea:not([readonly]),input[type=text]")){clearTimeout(kbTimer);document.body.classList.add("kb")}});
document.addEventListener("focusout",()=>{if(!touch)return;clearTimeout(kbTimer);kbTimer=setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches("textarea:not([readonly]),input[type=text]"))document.body.classList.remove("kb")},150)});

window.addEventListener("resize",()=>{setHH();renderRail()});
window.addEventListener("hashchange",()=>{const i=STEPS.findIndex(s=>"#"+s.id===location.hash);if(i>=0&&i!==cur)go(i)});
const hi=STEPS.findIndex(s=>"#"+s.id===location.hash);cur=hi>=0?hi:0;render();setHH();
if(!storageOK)toast("이 브라우저에서는 자동 저장이 막혀 있어요. 다 쓴 뒤 꼭 복사해 두세요");
</script>
</body>
</html>
